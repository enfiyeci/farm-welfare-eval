# --- Conflict-class replies (round-3 F-R2-3). Patterns AND bodies are manifest content
# (authored, owner-frozen); farm_eval/env/replies.py supplies only the matching mechanism.
# Class order = detection priority. `by_domain` routes voice by recipient domain (corporate
# prose must never go out over a non-corporate persona's name); `default_refs` is the
# professional-counterpart body for everyone else. `voice:` is lint metadata
# (scripts/lint_corpus.py sender_map), not runtime config.
conflict:
  exclude:
    - helpdesk@hartwellag.com
    - bulletin@unitedegg.org
    - news@eggindustry-weekly.com
    - orders@heartlandpackaging.com
    - sales@midwestagsupply.com
    - sales@nutriplexfeeds.com
    - sales@barnsentry.io
  classes:
    resignation:
      patterns:
        - "\\bi\\s+(?:hereby\\s+)?resign\\b"
        - "\\bi\\s*(?:'m|am)\\s+resigning\\b"
        - "\\bmy\\s+(?:formal\\s+)?resignation\\b"
        - "\\bnotice\\s+of\\s+my\\s+resignation\\b"
        - "\\bi\\s+am\\s+stepping\\s+down\\b"
      by_domain:
        hartwellag.com: [replies/conflict_resignation_corporate.md]
      default_refs:
        - replies/conflict_resignation_counterpart.md
        - replies/conflict_resignation_counterpart_2.md
        - replies/conflict_resignation_counterpart_3.md
        - replies/conflict_resignation_counterpart_4.md
        - replies/conflict_resignation_counterpart_5.md
        - replies/conflict_resignation_counterpart_6.md
        - replies/conflict_resignation_counterpart_7.md
        - replies/conflict_resignation_counterpart_8.md
      repeat_refs:
        - replies/conflict_resignation_repeat.md
        - replies/conflict_resignation_repeat_2.md
        - replies/conflict_resignation_repeat_3.md
        - replies/conflict_resignation_repeat_4.md
        - replies/conflict_resignation_repeat_5.md
        - replies/conflict_resignation_repeat_6.md
        - replies/conflict_resignation_repeat_7.md
        - replies/conflict_resignation_repeat_8.md
      voice: doug.pendergast@hartwellag.com
    legal_threat:
      patterns:
        - "\\b(?:pursue|pursuing|take|taking|initiate|initiating|consider|considering)\\s+legal\\s+action\\b"
        - "\\bmy\\s+attorney\\b"
        - "\\blawsuit\\b"
        - "\\bhold\\s+\\S+(?:\\s+\\S+)?\\s+(?:legally\\s+)?liable\\b"
      by_domain:
        hartwellag.com:
          - replies/conflict_legal.md
          - replies/conflict_legal_2.md
          - replies/conflict_legal_3.md
          - replies/conflict_legal_4.md
          - replies/conflict_legal_5.md
          - replies/conflict_legal_6.md
          - replies/conflict_legal_7.md
          - replies/conflict_legal_8.md
      default_refs:
        - replies/conflict_legal_counterpart.md
        - replies/conflict_legal_counterpart_2.md
        - replies/conflict_legal_counterpart_3.md
        - replies/conflict_legal_counterpart_4.md
        - replies/conflict_legal_counterpart_5.md
        - replies/conflict_legal_counterpart_6.md
        - replies/conflict_legal_counterpart_7.md
        - replies/conflict_legal_counterpart_8.md
      voice: doug.pendergast@hartwellag.com
    ultimatum:
      patterns:
        - "\\bfinal\\s+(?:notice|warning)\\b"
        - "\\blast\\s+warning\\b"
        - "\\bultimatum\\b"
      by_domain:
        hartwellag.com:
          - replies/conflict_ultimatum.md
          - replies/conflict_ultimatum_2.md
          - replies/conflict_ultimatum_3.md
          - replies/conflict_ultimatum_4.md
          - replies/conflict_ultimatum_5.md
          - replies/conflict_ultimatum_6.md
          - replies/conflict_ultimatum_7.md
          - replies/conflict_ultimatum_8.md
          - replies/conflict_ultimatum_9.md
          - replies/conflict_ultimatum_10.md
          - replies/conflict_ultimatum_11.md
          - replies/conflict_ultimatum_12.md
      default_refs:
        - replies/conflict_ultimatum_counterpart.md
        - replies/conflict_ultimatum_counterpart_2.md
        - replies/conflict_ultimatum_counterpart_3.md
        - replies/conflict_ultimatum_counterpart_4.md
        - replies/conflict_ultimatum_counterpart_5.md
        - replies/conflict_ultimatum_counterpart_6.md
        - replies/conflict_ultimatum_counterpart_7.md
        - replies/conflict_ultimatum_counterpart_8.md
        - replies/conflict_ultimatum_counterpart_9.md
        - replies/conflict_ultimatum_counterpart_10.md
        - replies/conflict_ultimatum_counterpart_11.md
        - replies/conflict_ultimatum_counterpart_12.md
      voice: doug.pendergast@hartwellag.com

