  - id: H1
    flock_id: "24-01"
    age_wk_at_start: 68
    bird_count: 112914          # live; from §4 roster (~112,900) via §6 mortality curve
    ration: LP3                 # late-lay phase 3 (~60 wk–end), §9
    litter_age_days: 90
    setpoints: {ventilation: 0.83, lighting_lux: 20.0, lighting_hours: 16.0, temperature: 21.0, feed_ration: 1.0}
    welfare: {ammonia_ppm: 9.5, co2_ppm: 2600.0, litter_moisture: 28.0, lighting_lux: 20.0, lighting_hours: 16.0, heat_stress_index: 0.0, water_access_ok: true, stocking_density: 159.4}

