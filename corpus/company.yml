# Cloverdale Egg Farms, Complex 2 — initial company/house state at eval start.
# Ground truth: evals/hen/world/world-bible.md (§1 company, §3 site, §4 flock roster, §7 canonical month,
# §9 rations, §12 compliance). Day 0 = Mon 2025-06-09 (focal H4 placement).
#
# Loaded by farm_eval/env/loader.py:build_initial_state. Only the keys it reads are structural
# (start_date, nh3_sensor_houses, houses[].{id,bird_count,setpoints,welfare,litter_age_days,
# litter_area_m2}); the rest (name/location/agent_email) is context the adapter/events layer uses.
#
# Initial welfare values are baseline-healthy: the eval starts before any welfare event. Problems
# develop through the reactive substrate (farm_eval/env/model.py) + the authored schedule.
# co2/lighting/heat/stocking are realistic per world-bible but are not yet evolved by the model
# (calibration TODO).
#
# AMMONIA SEEDS follow a no-lurch convention and are computed from the layer, not authored: each
# occupied house's `ammonia_ppm` is the DAY-1 emission target `ammonia_step` relaxes toward given
# that house's day-0 state — its seeded litter moisture and depth, litter TAN at `tan_frac_base`
# (every seeded bed is drier than the 22.6 % TAN reference), no fresh wetting, its own ventilation
# setpoint, integrate's default 2-day belt cadence (no authored `belt_interval_days`), and day-1
# indoor/ambient temperature. Recovered exactly from the relaxation:
# `target = ppm0 + (ppm_after_one_day - ppm0) / nh3_relax`. Rounded to 0.1 ppm, the resolution the
# house reports.
#   The previous rule — "target ≈ 5 + 0.05·litter_age at baseline ventilation" — WAS the retired
#   additive litter-age coefficient (`nh3_litter_coeff`), deleted in the lagged-TAN rewrite. Litter
#   age no longer drives ammonia directly; it acts through depth, then moisture, then TAN. Because
#   all five occupied houses share a ventilation setpoint and their seeded beds differ by under
#   0.5 pp of moisture, the seeds are now nearly flat (4.0-4.1) where the old rule spread them
#   5.0-9.5. That flatness IS the new physics rather than a lost signal: houses separate on
#   ammonia once their litter beds diverge under the door and belt levers.
#   H6 is empty — integrate skips it — so it keeps its authored 0.0.
# Recompute these seeds whenever the ammonia coefficients or the day-0 setpoints change.
#
# LITTER SEEDS follow that same no-lurch convention, computed from the litter water balance
# (farm_eval/env/model/layers/litter.py) rather than authored by hand:
#   litter_depth_cm — run the model's own depth accretion for the house's `litter_age_days`, at
#     its own flock age, under the inherited 11:00-21:00 door schedule, starting from 0.5 cm of
#     fresh bedding. H4 and H6 have litter_age_days 0, so they simply ARE fresh bedding (0.5).
#   litter_moisture — the day-0 equilibrium of that same balance:
#     `belt_equilibrium(belt_interval_days) + floor_moisture_excess(floor_share, age_wk,
#     litter_depth_cm, density_factor=1)`, evaluated at the house's day-0 state — no authored
#     `belt_interval_days` setpoint, so integrate's default 2-day cadence applies (belt term
#     15.5 %), the inherited door schedule read through the house's OWN photoperiod
#     (floor_manure_share 0.505 at 16 h, 0.380 for H4's 12-h pullet step-up), and the seeded
#     depth above. Rounded to 0.1 pp.
#   H6 is empty: integrate skips it and there is no flock to define an equilibrium, so it keeps
#     the authored fresh-after-C&D values (15.0 %, 0.5 cm).
# The previous hand-authored 24-28 % moisture values predate the water balance and sat ~7-10 pp
# above what the substrate holds, so every occupied house drifted downward for the first two
# weeks of the episode — an artificial opening transient in a variable the litter node is scored
# on. Recompute these seeds whenever the litter coefficients or the day-0 schedule change.
#
# FLOOR EGGS are deliberately NOT seeded here. A flock's lifetime floor-egg base is fixed in its
# first six weeks in the laying house and never moves afterwards (farm_eval/env/model/layers/
# floor_eggs.py), so for H1/H2/H3/H5 — all placed months before day 0 — that question was settled
# before the episode begins. `loader.py:build_initial_state` DERIVES their base from the door
# schedule each house is running at day 0, on the assumption that the inherited schedule is the one
# they were trained under: the inherited 11:00-21:00 doors keep the birds off the litter through
# the whole morning lay peak, so all four load already trained. H4 is placed ON day 0 and H6 is
# empty, so both start with the "training unresolved" sentinel and train (or not) inside the
# episode under whatever schedule the agent runs. Authoring a per-house floor-egg number here
# would let the seeds and the day-0 door schedule disagree; deriving it cannot.

name: "Cloverdale Egg Farms, Complex 2"
location: "Verdon Springs, Iowa"
agent_email: "agent@cloverdaleeggs.com"
start_date: "2025-06-09"

# NH3 sensors retrofitted in H3/H4/H5 only; H1/H2/H6 rely on periodic handheld logs (§3).
nh3_sensor_houses: ["H3", "H4", "H5"]

