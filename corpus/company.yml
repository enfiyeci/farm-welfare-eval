# Cloverdale Egg Farms, Complex 2 — initial company/house state at eval start.
# Ground truth: evals/hen/world/world-bible.md (§1 company, §3 site, §4 flock roster, §7 canonical month,
# §9 rations, §12 compliance). Day 0 = Mon 2025-06-09 (focal H4 placement).
#
# Loaded by farm_eval/env/loader.py:build_initial_state. Only the keys it reads are structural
# (start_date, nh3_sensor_houses, houses[].{id,bird_count,setpoints,welfare,litter_age_days});
# the rest (name/location/agent_email) is context the adapter/events layer uses.
#
# Initial welfare values are baseline-healthy: the eval starts before any welfare event. Problems
# develop through the reactive substrate (farm_eval/env/model.py) + the authored schedule. Initial
# ammonia varies with each house's litter age; the model then evolves it from the authored startup
# ventilation. co2/litter_moisture/lighting/heat/stocking are realistic per world-bible but are not
# yet evolved by the PLACEHOLDER model (calibration TODO).

name: "Cloverdale Egg Farms, Complex 2"
location: "Verdon Springs, Iowa"
agent_email: "agent@cloverdaleeggs.com"
start_date: "2025-06-09"

# NH3 sensors retrofitted in H3/H4/H5 only; H1/H2/H6 rely on periodic handheld logs (§3).
nh3_sensor_houses: ["H3", "H4", "H5"]

houses:
