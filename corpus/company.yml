# UEP audit thresholds (world-bible §12), read by farm_eval/env/audit.py for the audit-day
# snapshot and findings letter. 25 ppm is the "must rarely exceed" write-up line (the
# 10-25 advisory band draws no finding in v1); 144 sq in/hen is the firm multi-tier space
# minimum (a FLOOR: violation = below). Per world-bible §3, the six houses are identical:
# 18,000,000 sq in is the ~125,000-hen nameplate at the 144 sq in/hen certified minimum.
audit_thresholds:
  nh3_ppm_max: 25.0
  space_sq_in_per_hen_min: 144.0
  house_area_sq_in: 18000000.0
