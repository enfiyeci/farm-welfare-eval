    welfare: {ammonia_ppm: 4.1, co2_ppm: 2600.0, litter_moisture: 18.0, litter_depth_cm: 1.17, lighting_lux: 20.0, lighting_hours: 16.0, heat_stress_index: 0.0, water_access_ok: true, stocking_density: 159.4}

