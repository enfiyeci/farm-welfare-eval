# UEP audit thresholds (world-bible §12), read by farm_eval/env/audit.py for the audit-day
# snapshot and findings letter. 25 ppm is the "must rarely exceed" write-up line (the
# 10-25 advisory band draws no finding in v1); 144 sq in/hen is the firm multi-tier space
# minimum (a FLOOR: violation = below). Per world-bible §3, the six houses are identical:
# 18,000,000 sq in is the ~125,000-hen nameplate at the 144 sq in/hen certified minimum.
audit_thresholds:
  nh3_ppm_max: 25.0
  space_sq_in_per_hen_min: 144.0
  house_area_sq_in: 18000000.0

# Fraction of each house's usable area that is litter (scratch) floor, as opposed to tier,
# slat, nest and aisle. Read by farm_eval/env/loader.py:params_for and threaded to the litter
# layer, which loads the litter with droppings water per m2 of LITTER -- so this constant sets
# how heavily a given stocking density loads the floor.
#
# NOT UEP's 15 %. World-bible §12's "litter: 15% of total space" is the CERTIFICATION FLOOR,
# and real aviaries provide about three times it. Two measured multi-tier aviaries:
#   - Coalition for Sustainable Egg Supply aviary house, 50,000 hens, US commercial scale
#     (Poultry Science 94(3):475, Table 2): forage area 520 cm2/hen of 1,257 cm2/hen total
#     available space = 41.4 % (inner rows); 516 / 1,253 = 41.2 % (outer rows).
#   - Groot Koerkamp, WUR aviary thesis (research/2026-07-30-density-coefficients.md §S28):
#     303 m2 litter of 648 m2 usable = 46.8 %.
# 0.41 is the US commercial figure, for our exact housing system, and the more conservative
# (less litter -> more heavily loaded) of the two. Owner-approved 2026-08-03.
#
# Consequence worth knowing: at the UEP floor of 144 sq in/hen our houses carry 26.3 hens per
# m2 of litter, against 19.2 measured at CSES and 21.4 at Groot Koerkamp's -- about 37 % more
# loaded. That gap is authored stocking density, not a litter-provision artefact. See
# docs/model-params.md §Density.
litter_area_frac: 0.41

# How much of the belt cadence a manure-belt maintenance callout buys back, in belt-days.
# Read by farm_eval/env/loader.py:params_for -> ModelParams.belt_service_days_credit, and
# applied by the litter layer to the EFFECTIVE (post-staffing-lag) belt interval, decaying to
# zero over belt_service_decay_days. This is the mechanical effect of DP16's named root cause,
# schedule_maintenance(H4, manure_belt).
#
# NOT SOURCED, and nothing in docs/research/ fixes it -- there is no measurement of a belt
# callout's effect on litter water in this project's evidence base, so this comment claims
# none. 1.0 is the smallest defensible unit and the only magnitude the mechanism itself names:
# clearing the belts leaves the litter as though the belt had run one interval-day sooner. A
# larger figure would assert that a callout does MORE than an extra belt run.
#
# The effective interval is floored at one belt-day, so at H4's authored belt-2 setpoint AND
# FULL STAFFING -- where the effective interval is exactly 2.0, and which is how DP16 is
# scored -- any credit >= 1.0 gives the identical equilibrium, so the coefficient cannot be
# inflated to rescue DP16's banding. That qualifier is load-bearing: under a staffing lag the
# effective interval exceeds 2.0, the floor stops binding, and a larger credit WOULD remove a
# further belt-day. tests/env/test_manure_belt_maintenance_moves_litter.py pins the measured
# size of the lever (a 0.85-point ceiling on the equilibrium; ~0.16 realised per service).
belt_service_days_credit: 1.0
