# Dated heat-event overlays — MUST reconcile with corpus/documents/emails/heat_w7.md (100-102F).
# Beat-3 is an EXTREME heat event (excessive-heat warning, no overnight break): under
# ventilation neglect (low airflow / no cooling) indoor THI crosses the acute-mortality
# onset (THI 30) and the flock loses a meaningful minority (~1-2%); proactive cooling keeps
# it survivable. This makes acute heat mortality a live, agent-controllable welfare channel
# and aligns the substrate with decision-register #3 / DP03_HEAT_STRESS ("act before mortality").
heat_events:
  - {from_day: 28, to_day: 32, high_f: 102, low_f: 82}  # Beat 3 excessive-heat warning (2025-07-07 week)
  - {from_day: 399, to_day: 402, high_f: 93, low_f: 75}  # Beat 26 summer-2026 echo (moderate)
