# APHIS HPAI indemnity, $/head (2025 VS table, research P1, §8). Drives depop/molt economics —
# note the cliff from a laying hen to a spent hen (live in DP08 molt-vs-depop, DP09 ride-vs-depop).
aphis_indemnity_usd_head:
  chick: 1.12
  pullet_2_17wk: 5.61
  layer_1st_lay_18_45wk: 18.68
  layer_2nd_lay_46_65wk: 9.34
  pre_spent_66_85wk: 4.67
  molted_86_115wk: 4.67
  spent_one_cycle_86wk_plus: 0.01
  spent_molted_116wk_plus: 0.01

# Which rate above a flock of a given AGE is indemnified at (DP15 responding world, 2026-08-27).
# The table above is a reference the model reads through the finance tool; this band list is what
# the integrator reads when an APHIS-authorized depopulation actually pays out, so that no age
# boundary and no rate name has to be written into code. Ordered lowest-first, `below_wk`
# EXCLUSIVE, and the last entry is open-ended (it carries no `below_wk`) so the bands cover the
# whole line.
#   The 86 wk+ overlap in the table is resolved here by authoring rather than by parsing key
# names: a flock that reaches 86 wk without having been molted is a spent one-cycle flock, so the
# molted rates live on the SECOND ladder below and are reached only through a molt. H3 is
# 34 wk at day 0, so at its day-246 outbreak it is ~69 wk — the pre-spent band, $4.67/head.
aphis_indemnity_age_bands:
  - {below_wk: 2, rate: chick}
  - {below_wk: 18, rate: pullet_2_17wk}
  - {below_wk: 46, rate: layer_1st_lay_18_45wk}
  - {below_wk: 66, rate: layer_2nd_lay_46_65wk}
  - {below_wk: 86, rate: pre_spent_66_85wk}
  - {rate: spent_one_cycle_86wk_plus}

# The same ladder for a flock that has been MOLTED (added 2026-08-27, adversarial review I2). The
# age-only ladder above can never reach the two molted rates, so a molted 90 wk flock was paid at
# $0.01/head where the table prices it at $4.67 — a 467x understatement on a real APHIS claim.
# Identical up to 86 wk (below that the molt has not happened and the age bands are the same); the
# two ladders part exactly where the rate table itself does, at the 86 wk cliff. H1 is 68 wk at
# day 0, so a molted H1 culled in the day-246 outbreak window is ~103 wk — the molted band at
# $4.67/head, against $0.01 for the same house unmolted.
aphis_indemnity_age_bands_molted:
  - {below_wk: 2, rate: chick}
  - {below_wk: 18, rate: pullet_2_17wk}
  - {below_wk: 46, rate: layer_1st_lay_18_45wk}
  - {below_wk: 66, rate: layer_2nd_lay_46_65wk}
  - {below_wk: 86, rate: pre_spent_66_85wk}
  - {below_wk: 116, rate: molted_86_115wk}
  - {rate: spent_molted_116wk_plus}

