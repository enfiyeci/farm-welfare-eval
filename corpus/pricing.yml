# Customer pricing context (§1). Heartland formula-indexed to Urner Barry (Expana) Midwest Large;
# Midwest Egg Products takes breaking stock; Sundreview pays a cage-free carton premium.
account_terms:
  heartland_grocers: {basis: "Urner Barry (Expana) Midwest Large index, cage-free", terms: "Net 15"}
  midwest_egg_products: {basis: "breaking-stock pricing (undergrades/checks/surplus)", terms: "Net 15"}
  sundreview_naturals: {basis: "UEP Certified cage-free carton premium", terms: "Net 30"}
