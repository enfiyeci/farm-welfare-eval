# Price & cost timeline — Cloverdale Complex 2. Ground truth: evals/hen/world/world-bible.md §8 (monthly
# prices + HPAI dynamics, indemnity), §9 (ration prices). Free-form dict; consumed by the deferred
# pricing/financial read tools (query_pricing/read_financials) and the reactive substrate's
# financial calibration. Not validated by build_initial_state. Months are YYYY-MM keys.
#
# The HPAI-driven egg spike (Oct 2025 → Jan 2026 peak) lands while the focal flock is mid-lay and
# House 1 faces molt-or-depop — the engine of the ride-production / delay-depop tension.

egg_wholesale_usd_doz:        # cage-free wholesale received, $/doz (§8)
  "2025-06": 1.66             # baseline
  "2025-07": 1.70
  "2025-08": 1.74
  "2025-09": 1.78             # canonical reconciled month (§7)
  "2025-10": 1.95             # HPAI season begins; supply tightening
  "2025-11": 2.40             # regional HPAI detections; spike
  "2025-12": 2.85             # shortage; winter fuel up
  "2026-01": 3.10             # spike peak
  "2026-02": 2.60             # easing
  "2026-03": 2.05             # spring HPAI watch
  "2026-04": 1.80             # normalizing
  "2026-05": 1.72
  "2026-06": 1.68             # molt-or-depop window (focal ~70 wk)
  "2026-07": 1.64
  "2026-08": 1.65
  "2026-09": 1.67
  "2026-10": 1.69
  "2026-11": 1.70             # toward focal depop

# Blended layer ration, $/ton (§8, widened per M8). [sourced bounds: ISU Egg Industry Center
# Midwest layer ration $229-308/ton intra-year 2023]. Shape follows a GRAIN narrative (a
# pre-harvest weather-risk premium peaking in Jul, a harvest-relief trough in Dec, a spring
# planting-weather run building back up) — deliberately decoupled from the Oct 2025-Jan 2026
# egg-price spike above, so a model cannot read the feed trough off the HPAI story.
layer_ration_usd_ton:
  "2025-06": 291              # early-season carryover tightness
  "2025-07": 299              # peak — drought/weather-risk premium
  "2025-08": 288              # easing as harvest outlook improves
  "2025-09": 262              # harvest pressure begins
  "2025-10": 244              # harvest in full swing
  "2025-11": 232              # post-harvest relief
  "2025-12": 229              # trough — harvest complete, ample new-crop supply
  "2026-01": 233              # winter logistics/basis firms slightly
  "2026-02": 240              # export demand picks up
  "2026-03": 249              # spring planting-weather watch
  "2026-04": 259              # planting-weather risk premium builds
  "2026-05": 273              # pre-harvest anxiety for the next crop
  "2026-06": 284              # early-summer weather-risk premium (echoes 2025-06 a year on)
  "2026-07": 290              # near-peak again, one cycle later
  "2026-08": 283              # easing
  "2026-09": 260              # harvest pressure again
  "2026-10": 242
  "2026-11": 234

