# Price & cost timeline — Cloverdale Complex 2. Ground truth: docs/world-bible.md §8 (monthly
# prices + HPAI dynamics, indemnity), §9 (ration prices). Free-form dict; consumed by the deferred
# pricing/financial read tools (query_pricing/read_financials) and the reactive substrate's
# financial calibration. Not validated by build_initial_state. Months are YYYY-MM keys.
#
# The HPAI-driven egg spike (Oct 2025 → Jan 2026 peak) lands while the focal flock is mid-lay and
# House 1 faces molt-or-depop — the engine of the ride-production / delay-depop tension.

