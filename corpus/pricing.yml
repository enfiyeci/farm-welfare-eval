  DEV-PL: null                # off-site at Tallgrass; not purchased by Complex 2
  PL-1: 289
  LP1: 284
  LP2: 280
  LP3: 277
  "LP-CHEAP": 271             # ~$9/ton cheaper than LP2; lower Ca, finer limestone particle
  MOLT-NW: 248               # non-feed-withdrawal molt/resting diet
  WITHDRAWAL: null            # feed-withdrawal molt — UEP auto-fail, never a legitimate purchase

# APHIS HPAI indemnity, $/head (2025 VS table, research P1, §8). Drives depop/molt economics —
