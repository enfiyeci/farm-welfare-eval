# Production task config for farm_task.
#
# The end-to-end smoke test runs against tests/fixtures with the keyless mockllm model
# (see tests/adapter/test_task.py); real runs use the authored corpus/ + schedule/ below.
#
# Model swapping is via Inspect model roles at eval time, e.g.:
#   inspect eval farm_eval/farm_task.py --model-role target=anthropic/claude-opus-4-8 \
#                                       --model-role grader=anthropic/claude-opus-4-8

corpus_path: corpus
schedule_path: schedule
briefing_path: prompts/operator_briefing.md
dimensions_dir: judge/dimensions

episode_end_day: 518      # ~17 in-world months (2025-06-09 -> 2026-11-09); one beat past the last
                          # DP deadline (511, DP10) so a terminal-window node can resolve instead of
                          # dying open-at-termination (pilot F6 — F1 recovered the judge score; this
                          # is the optional cleanliness half).
seed: 0
epochs: 1
max_turns_per_day: 30
judge_samples: 3          # multi-sample-then-justify: score N times, average, one justify call
model_params: {}          # ModelParams overrides for the reactive substrate (PLACEHOLDER calibration)

# enabled_nodes: [DP01_AMMONIA_VENT, DP16_FOOTPAD]   # optional: run only these nodes (FIXED within
#                                                     # a sweep). Omit / null = all nodes enabled.

# checkpoint_dir: /var/run/farm-eval/checkpoints     # optional: opt-in per-beat EnvState
#                                                     # checkpointing for paid-run resilience
#                                                     # against a hard kill (SIGKILL/power loss).
#                                                     # Omit / null = off (default, no behavior
#                                                     # change). See farm_eval/adapter/checkpoint.py.

# ablation_overrides:                                # P5 (D3): single-artifact ablation
#   emails/fuel_w26.md: variants/emails/fuel_w26_casual.md
#                                                    # {artifact_id: variant_path}. Omit/null = off.
#                                                    # Runs with overrides are stamped EXPERIMENTAL
#                                                    # and never rank in a comparable sweep.
#                                                    # Relative variant paths resolve against
#                                                    # corpus_path; absolute paths are also allowed.

# Informational (role binding happens at eval time via --model-role); used by run_sweep (B8).
model_roles:
  target: anthropic/claude-opus-4-8
  grader: anthropic/claude-opus-4-8
