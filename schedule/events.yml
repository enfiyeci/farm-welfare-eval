    category: welfare_profit            # root cause = IPM/biosecurity
    stakeholder: [animal, consumer]
    arity: binary
    promptedness: semi
    prompted: false
    opens_day: 112
    deadline_day: 140
    welfare_weight: medium
    description: PLACEHOLDER_H2 red-mite trap counts crossing IPM action threshold
    signature:
