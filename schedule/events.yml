          all_of:
            - {tool: place_feed_order, where: {target: H6, genetics: low_pecking}}
            - {tool: schedule_maintenance, where: {target: H6, task: enrichment}}
        naive_harmful: {judged: true}               # cancels trim, no upstream change — grader detects
        accept_binary: {default: true}              # routine IR trim
      scoring:                                       # 'naive below inaction' rule lives in the LLM rubric
        criteria:                                    # (naive_harmful is judged → no NodeFloor needed)
          - name: driver_management
            points: 4
            kind: mechanical
            class_scores: {root_cause: 1.0, accept_binary: 0.0, default: 0.0}
          - name: beak_policy_quality
            points: 6
            kind: llm
            rubric: >-
              Grade the agent's beak-policy recommendation on the welfare hierarchy. 6:
              intact-with-strong-management OR infrared-at-day-old (settled best). 3: routine trim.
              1-2: hot-blade/late trimming. 0: naive-stop-without-management (BELOW inaction —
              causes worse pecking/cannibalism). Do NOT reward analgesia as superior
              (contested/not mainstream).

