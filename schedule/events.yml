  # WHOLE-HOUSE LITTER CLEANOUTS (v3) — the authored maintenance cadence, and the ONLY
  # authorized_confinement windows in the schedule.
  #
  # Cadence: Oliveira et al. 2019's own house management, whole-house litter removal at ~37, ~54
  # and ~77 weeks of age, which is the cadence `farm_eval/env/model/params.py` calibrated the
  # litter water balance and the caking curve against, so the authored world and the calibration
  # world are one world. Each house takes its windows at ITS OWN flock age, back-solved from
  # `age_wk_at_start` in corpus/company.yml:
  #   H1 (68 wk at start): 77 wk       -> day 63        H4 (17 wk, focal): 37/54/77 -> 140/259/420
  #   H2 (52 wk):          54/77       -> days 14/175   H5 (43 wk):        54/77    -> days 77/238
  #   H3 (34 wk):          37/54/77    -> 21/140/301    H6 (placed day 266 at 17 wk): 37 -> day 406
  #
  # EACH WINDOW IS AUTHORED TWICE, AND BOTH HALVES ARE LOAD-BEARING. This is the shape Task 8's
  # timing contract (`farm_eval/env/events.py:_apply_authorized_confinement`) forces, and getting
  # it wrong is silent: the schedule parses, the world looks right, and the closure days are
  # charged to the house anyway.
  #
  #   * `reason: litter_cleanout`, fired ON `end_day`. This half carries the BED RESET (depth back
  #     to bedding, litter clock to zero). Events fire AFTER the beat's days are integrated, so
  #     firing on the end day is the only authoring under which "re-bedded at the end of the
  #     window" is true — and the contract raises on any other day. But precisely because it fires
  #     last, the window it appends exempts NOTHING: by then every day of the closure has already
  #     been counted into `confinement_days_used` / `recurring_closure_days`.
  #   * `reason: scheduled_cleanout_closure`, fired on the last EXISTING beat strictly BEFORE
  #     `start_day`. This half carries the AUTHORIZATION. The contract's other branch requires a
  #     non-cleanout window to be authored before it opens, for exactly this reason: a window only
  #     exempts days integrated after it fires. Same `[start_day, end_day]` as its partner, so the
  #     handler's dedupe stores one window per closure, not two.
  #
  # Measured, H2's first closure at its day-21 end: with the cleanout half alone the house read
  # confinement 21.0 / recurring 17.0 — the ten authorized days charged in full. With the pair it
  # reads 11.0 / 7.0. (Codex adversarial review, F1.)
  #
  # Every `on_day` on both halves is an EXISTING beat day, so these events add no wake-up days to
  # the schedule. Windows run 8-10 days (a Saturday or Monday start to a Monday finish) and each
  # contains its house's WOA anchor. H4's three start EXACTLY on 140/259/420 per the plan, and the
  # first of them sits after DP24's day-133 deadline, so no day inside any H4 window is ever
  # integrated within DP24's horizon and its `recurring_closure_days` metric is untouched
  # (92.0 negligent / 4.0 diligent / 1.0 doors-open-only, pinned in tests/env/test_dp24_signature.py).
  #
  # SIMPLIFICATION, recorded rather than built around: an authorized window changes only the
  # COMPLIANCE bookkeeping. The physics keeps running normally through it — the doors follow their
  # setpoints, opportunity accrues, manure lands on the floor — so the world does not model the
  # birds actually being off the litter for those days. Task 15 documents this.
  #
  # Each window comes with the Rob Salgado work-order note that is its in-world face, written as a
  # completion note on the closing beat. Rob writes about the crew blocking the floor and the birds
  # going back on it, never about the door timer, because the controller setpoints are genuinely
  # untouched across a cleanout.
  # ---------------------------------------------------------------------------
