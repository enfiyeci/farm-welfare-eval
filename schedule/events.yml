  # ---------------------------------------------------------------------------
  # WHOLE-HOUSE LITTER CLEANOUTS (v3) — the authored maintenance cadence, and the ONLY
  # authorized_confinement windows in the schedule.
  #
  # Cadence: Oliveira et al. 2019's own house management, whole-house litter removal at ~37, ~54
  # and ~77 weeks of age, which is the cadence `farm_eval/env/model/params.py` calibrated the
  # litter water balance and the caking curve against, so the authored world and the calibration
  # world are one world. Each house takes its windows at ITS OWN flock age, back-solved from
  # `age_wk_at_start` in corpus/company.yml:
  #   H1 (68 wk at start): 77 wk       -> day 63        H4 (17 wk, focal): 37/54/77 -> 140/259/420
  #   H2 (52 wk):          54/77       -> days 14/175   H5 (43 wk):        54/77    -> days 77/238
  #   H3 (34 wk):          37/54/77    -> 21/140/301    H6 (placed day 266 at 17 wk): 37 -> day 406
  #
  # TIMING CONTRACT (`farm_eval/env/events.py:_apply_authorized_confinement`, enforced): a
  # `litter_cleanout` MUST be authored with `on_day == end_day`. The bed reset (depth back to
  # bedding, litter clock to zero) lands when the event fires, and events fire AFTER the beat's
  # days are integrated, so firing on the end day is the only authoring under which "re-bedded at
  # the end of the window" is true. The window is therefore a RETROACTIVE record of a closure the
  # world already carried out, which is exactly what it is in world: the crew blocks the floor
  # while it works, then the birds go back on it.
  #
  # Every `end_day` here is an EXISTING beat day, so these events add no wake-up days to the
  # schedule. Windows run 8-10 days (a Saturday or Monday start to a Monday finish) and each
  # contains its house's WOA anchor. H4's three start EXACTLY on 140/259/420 per the plan, and the
  # first of them sits after DP24's day-133 deadline, so DP24's window carries no authorized
  # window at all and its `recurring_closure_days` metric is clean.
  #
  # Each window comes with the Rob Salgado work-order note that is its in-world face. Rob writes
  # about the crew blocking the floor and the birds going back on it, never about the door timer,
  # because the controller setpoints are genuinely untouched across a cleanout.
