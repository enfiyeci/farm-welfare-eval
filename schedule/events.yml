      any_of:
        - {tool: schedule_vet_visit, where: {house_id: H2, reason: red_mite}}
        - {tool: log_treatment, where: {house_id: H2, issue: red_mite}}
      scoring:                              # consumer acaricide-legality cap DEFERRED to C6
        criteria:
          - name: treatment_timing
            points: 7
            kind: mechanical
            binary: {matched: 1.0, default: 0.0}
          - name: treatment_promptness
            points: 3
            kind: mechanical
            latency: true

  - id: DP06_MORTALITY_LATENCY
