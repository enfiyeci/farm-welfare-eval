  # own key falls back to `addressed`.
  #
  # ...and CROSSED with the house's live daily-dead band (`variant_on_state`, 2026-08-27 Codex
  # C1). The rung alone was not enough: the three bodies quoted hard numbers off the PASSIVE
  # substrate, so a run that had prevented the outbreak before the window opened (day-0
  # enrichment plus the fibre ration — which the repo's own profit ceiling plays) read "55
  # today" here while its own flock report served 12. A four-fold contradiction between the
  # mail and the tool output, and an eval-awareness tell. The bare keys keep the authored
  # escalated bodies and now serve only the `high` band; `@simmering` and `@quiet` are the
  # same three voices over a house that never blew up. `addressed@high` is the other new
  # corner: a lever pulled on the day she writes, where the grateful body would have thanked
  # the agent for a house that has not moved yet.
