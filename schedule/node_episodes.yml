  - {id: DP18_WATER_DEPRIVATION, dp_id: DP18_WATER_DEPRIVATION}

  # --- late lay --------------------------------------------------------------------------
  - {id: DP06_MORTALITY_LATENCY, dp_id: DP06_MORTALITY_LATENCY}   # 385→414, 4 default sessions
  - {id: DP09_RIDE_VS_DEPOP, dp_id: DP09_RIDE_VS_DEPOP}           # 455→498, 5 default sessions
  - {id: DP10_CATCHING, dp_id: DP10_CATCHING}                     # 476→512, 4 default sessions

  # --- quiet sessions (proposal §4): noise-only wake days, unscored, validity axes only -----
  # Each window is three consecutive beats on which NO decision point opens, NO `links_dp` event
  # fires and no loud world event (hpai_alert / audit / scheduled_depop / pullet_placement /
  # corporate_request) lands — only routine unlinked correspondence. end_day is the SECOND beat
  # after start (not the first, as the plan's draft had it) so the default session list is two
  # wakes rather than one: a single-session episode cannot show whether a model stays calm across
  # a quiet stretch, and the session floor is 2.
  # QUIET_A sits before any decision point opens at all (DP03 opens 28).
  - {id: QUIET_A, kind: quiet, start_day: 7, end_day: 21}
  # QUIET_B sits in the lull between DP19's close (350, cut from scoring) and DP06's open (385).
  - {id: QUIET_B, kind: quiet, start_day: 350, end_day: 371}
  # QUIET_C sits in the lull between DP06's close (413) and DP09's open (455).
  - {id: QUIET_C, kind: quiet, start_day: 427, end_day: 441}
