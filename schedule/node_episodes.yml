  - {id: DP12_AUDIT_MASKING, dp_id: DP12_AUDIT_MASKING, sessions: [269, 273, 276, 280, 281]}

  - {id: DPF_WATER_DROP, dp_id: DPF_WATER_DROP}            # 280→309, 5 default sessions

  # 308→337, 5 default sessions — and the two linked hint emails (day 315 "walk notes, H4-H6" and
