<script>
"use strict";

/* ===========================================================================
   Henhouse spectator page — one renderer over the Task-6 HTTP API.

   Server contract (farm_eval/spectator/server.py):
     GET /runs                              -> [{run_id, sample_id, size, live}], newest first
     GET /feed?run=&sample=&offset=<bytes>  -> {lines:[raw NDJSON strings], offset:<new>, live:bool}
     GET /email?run=&sample=&id=            -> {body}  (fallback; bodies also ride the feed)

   Two rules that are contracts, not choices:
   - the offset handed back to /feed is ALWAYS the one the server issued (a client-computed byte
     offset can land mid-character and 400 or garble);
   - `live` is false only once the feed carries `episode_end` — never a timeout, never mtime.

   Rendering rule: every visible value comes out of `derive(n)`, a pure function of
   `events[0..n]`, so scrubbing the cursor and watching live share one code path.
   =========================================================================== */

const POLL_MS = 1000;          // live poll cadence (spec §2)
const RUNS_POLL_MS = 2500;     // while waiting for a first feed to appear
const NH3_CEILING = 25;        // ppm — the display alert line (spec §5.1)
const SPARK_BARS = 26;
const FEED_ROWS_MAX = 400;     // DOM cap; the event array itself is never truncated
const ARG_CHARS = 64, RESULT_CHARS = 120, TEXT_CHARS = 900;
const MORT_WARN = 0.004;       // weekly mortality rate the welfare rail tones red (warning)
const MORT_MID = 0.002;        // …and the rate it tones yellow (worth watching)
const CW = 300, CH = 86, CPAD = 5;   // chart viewBox width/height and the top/bottom value padding
const TOAST_MS = 15000;        // how long a moment toast stays on screen
const TOAST_MAX = 3;           // never stack more than this many at once
const RATE_BARS = 14;          // day-rate history bars in the health strip
const REEL_ROWS_MAX = 300;     // DOM cap on the reel, like the agent feed's
const NOTE_MAX = 2000;         // characters a single annotation note may carry
const LABEL_CHARS = 90;        // how much of a row's own text an annotation remembers
const SNAP_SCALE = 2;          // snapshot pixel density
const SNAP_MAX_PX = 24e6;      // ceiling on capture pixels, so a tall page cannot blow the canvas
const SNAP_MSG_MS = 9000;      // how long the snapshot status line stays up
const AMB_MAX_GAIN = 0.55;     // master gain at volume 100 — ambience, never a foreground sound
const CLUCK_BASE = 0.16;       // clucks/second in a calm house
const CLUCK_PER_UNREST = 1.1;  // added clucks/second per unit of restlessness
const AMB_FADE_MS = 600;       // ms to let the master gain reach 0 before the context is suspended
const HEAT_HOURS_PER_DAY = 24; // the divisor that turns heat-stress hours into a 0-1 share

const $ = (id) => document.getElementById(id);
const el = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };

const S = {
  runs: [], run: null, sample: null,
  events: [], offset: 0, live: true,
  cursor: null,            // null = pinned to the tip of the buffer; a number = scrubbing
  follow: true,            // follow-the-agent in the mail pane
  picked: null,            // email chosen by hand (which also unfollows)
  house: null,             // open cutaway, by house_id
  tab: "all",
  bodies: {},              // /email fallback cache
  sig: null,               // last painted signature (cheap repaint guard)
  pollTimer: null,
  gen: 0,                  // feed generation; bumped by selectFeed so in-flight requests for the
                           // previous feed can be recognised and dropped (a fetch cannot be cancelled)
  view: "live",            // "live" | "charts" — which of the two top-level views is on screen
  /* Tip-of-buffer cache. The reel and the health strip describe the RUN, not the cursor's day, so
     they read a derivation at the tip (`beatDays` already set that precedent for navigation). It is
     still a pure function of events[0..tip]; the cache only avoids re-deriving per interaction. */
  tipLen: -1, tipD: null, moments: [],
  toasts: [],              // live toast objects {m, until}; transient, never derived state
  /* Rendered-key signatures for the two live-region/focusable surfaces. render() runs on every
     poll, and rewriting these two containers' innerHTML would restart the toast slide-in, make
     role="status" re-announce once a second, and steal focus from a tabbed-to reel row. */
  toastSig: null, reelSig: null,
  seen: new Set(),         // moment keys already announced — the anti-repeat set
  primed: false,           // the backlog a feed opens with is history, not news: prime, don't toast
  hover: null,             // {key, i} — the chart crosshair position, so a repaint can restore it
  /* ---- annotations (spec §5.4). USER state, not feed state: the flags and notes below are the
     reader's own, they live in localStorage under this feed's key, and no derivation reads them —
     which is why they sit here and not in `derive`. `marksVer` bumps on every mutation so the
     repaint guards (render's signature, the reel's row signature) see a change. */
  marks: {},               // key -> {key, kind, day, msg, label, note, ts}
  marksVer: 0,
  markInfo: new Map(),     // key -> {kind, day, msg, label} for the rows currently painted
  note: null,              // the key whose note editor is open
  storeErr: false,         // localStorage refused a write (private mode / quota) — say so, don't lie
  snapMsg: null,           // {text, tone, print} — the snapshot's own status line
  snapSig: null,           // its rendered signature; the line is a live region (see paintSnap)
  snapBusy: false,
  amb: { on: false, muted: false, vol: 0.45, unrest: 0, err: null },
};

/* ---------- formatters ---------------------------------------------------- */
const num = (v) => typeof v === "number" && isFinite(v);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
function fmtCount(v) {
  if (!num(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(1) + "B";
  if (a >= 1e6) return (v / 1e6).toFixed(1) + "M";
  if (a >= 1e4) return Math.round(v / 1e3) + "k";
  if (a >= 1e3) return (v / 1e3).toFixed(1) + "k";
  return String(Math.round(v));
}
const fmtNum = (v, d = 1) => num(v) ? v.toFixed(d) : "—";
const fmtPct = (v, d = 1) => num(v) ? v.toFixed(d) + "%" : "—";
const fmtCents = (v) => num(v) ? v.toFixed(1) + "¢" : "—";
const fmtRatePct = (v, d = 2) => num(v) ? (v * 100).toFixed(d) + "%" : "—";   // a 0-1 rate as a %
function fmtMoney(v) {
  if (!num(v)) return "—";
  return (v < 0 ? "−$" : "$") + fmtCount(Math.abs(v));
}
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const cut = (s, n) => { s = String(s == null ? "" : s); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const cToF = (c) => num(c) ? Math.round(c * 9 / 5 + 32) : null;

/* ---------- HTTP --------------------------------------------------------- */
async function api(path) {
  const res = await fetch(path, { cache: "no-store" });
  if (!res.ok) {
    // The status travels with the error: a 404 ("no such feed") is a different situation from
    // an unreachable server, and the two must not look the same on screen.
    const err = new Error(path.split("?")[0] + " -> " + res.status);
    err.status = res.status;
    throw err;
  }
  return res.json();
}
const feedQuery = () => "run=" + encodeURIComponent(S.run) + "&sample=" + encodeURIComponent(S.sample);

/* ===========================================================================
   Derivation — pure over events[0..n]. Nothing else may drive a pixel.
   =========================================================================== */
function derive(n) {
  const D = {
    meta: null, dayStart: null, day: null, maxDay: null,
    snap: null, snaps: [], finsnap: null, mail: new Map(), focus: null,
    decisions: new Map(), health: null, healths: [], rows: [], ended: false,
    turns: 0, toolsToday: 0, sent: 0, unread: 0,
  };
  for (let i = 0; i <= n && i < S.events.length; i++) {
    const e = S.events[i];
    if (!e || typeof e !== "object") continue;
    if (num(e.day)) D.maxDay = D.maxDay === null ? e.day : Math.max(D.maxDay, e.day);
    switch (e.kind) {
      case "run_meta":
        D.meta = e;
        break;
      case "day_start":
        D.dayStart = e; D.day = e.day;
        D.rows.push({ t: "day", day: e.day, date: e.date, season: e.season });
        break;
      case "day_end":
        break;
      // `seq` and `msg_id` ride along so a row can be annotated: seq is the feed's own stable
      // identity for the row, msg_id the transcript message an annotation should point at.
      case "assistant_text":
        D.turns++;
        D.rows.push({ t: "think", text: e.text, reasoning: !!e.reasoning, day: e.day,
                      seq: e.seq, msg: e.msg_id });
        break;
      case "tool_call":
        D.rows.push({ t: "tool", tool: e.tool, args: e.args, result: e.result_summary,
                      cost: e.cost_cents, day: e.day, seq: e.seq, msg: e.msg_id });
        break;
      case "email_delivered":
        D.mail.set(e.email_id, { id: e.email_id, dir: "in", who: e.sender, subject: e.subject,
                                 body: e.body, day: e.day, ts: e.ts_in_world, seq: e.seq, readDay: null });
        break;
      case "email_read": {
        const m = D.mail.get(e.email_id);
        if (m) m.readDay = e.day;
        else D.mail.set(e.email_id, { id: e.email_id, dir: "in", who: "—", subject: "(not carried in this feed)",
                                      body: null, day: e.day, ts: e.ts_in_world, seq: e.seq, readDay: e.day });
        D.focus = e.email_id;
        break;
      }
      case "email_sent": {
        const id = e.email_id || "sent-" + e.seq;
        D.mail.set(id, { id: id, dir: "out", who: e.to, subject: e.subject, body: e.body,
                         day: e.day, ts: e.ts_in_world, seq: e.seq, readDay: null });
        D.focus = id;
        break;
      }
      case "state_snapshot":
        D.snap = e; D.snaps.push(e);
        break;
      // L8: present only while the financial-skill axis is enabled. `finsnap` stays null for an
      // ablation feed, which is what keeps the credit panel off the page entirely.
      case "finance_snapshot":
        D.finsnap = e;
        break;
      case "decision_window":
        if (!D.decisions.has(e.dp_id)) {
          D.decisions.set(e.dp_id, { dp_id: e.dp_id, opens: e.opens, deadline: e.deadline,
                                     resolved: false, outcome: null, tripwire: false, latency: null });
        }
        break;
      case "decision_resolved": {
        const d = D.decisions.get(e.dp_id) || { dp_id: e.dp_id, opens: e.day, deadline: null };
        d.resolved = true; d.outcome = e.outcome; d.tripwire = !!e.tripwire; d.latency = e.latency_days;
        d.resolvedDay = e.day;        // the moment reel and its toasts jump to the day it happened
        D.decisions.set(e.dp_id, d);
        break;
      }
      case "run_health":
        D.health = e; D.healths.push(e);
        break;
      case "episode_end":
        D.ended = true; D.rows.push({ t: "end", day: e.day, status: e.status });
        break;
      default:
        break;   // an unknown kind from a newer emitter must never break the page
    }
  }
  if (D.health && num(D.health.turns)) D.turns = D.health.turns;
  for (const r of D.rows) if (r.t === "tool" && r.day === D.day) D.toolsToday++;
  for (const m of D.mail.values()) {
    if (m.dir === "out") D.sent++;
    else if (m.readDay === null) D.unread++;
  }
  return D;
}

/* Cursor helpers. `S.cursor === null` means "pinned to the tip". */
const tip = () => S.events.length - 1;
const cursor = () => S.cursor === null ? tip() : clamp(S.cursor, 0, Math.max(0, tip()));
const scrubbing = () => S.cursor !== null && S.cursor < tip();

/* day -> cursor. The running MAXIMUM day is what makes this a lookup: pre-episode history
   mail carries negative days inside the head frame, so the raw `day` field is not monotone. */
function cursorForDay(day) {
  let best = 0, seen = null;
  for (let i = 0; i < S.events.length; i++) {
    const d = S.events[i] ? S.events[i].day : null;
    if (num(d)) seen = seen === null ? d : Math.max(seen, d);
    if (seen !== null && seen > day) break;
    best = i;
  }
  return best;
}
function span(D) {
  const m = D.meta || {};
  const first = num(m.first_day) ? m.first_day : 0;
  let last = num(m.last_day) ? m.last_day : (num(D.maxDay) ? D.maxDay : first + 1);
  if (last <= first) last = first + 1;
  return { first: first, last: last };
}

/* ===========================================================================
   Annotations — the reader's own flags and notes (spec §5.4)

   These are ANNOTATIONS: raw material for a hand-labeling pass, collected while watching. They are
   deliberately NOT judge-validation rows — `judge/validate.py` consumes filled YAML label sheets
   with node/dimension ids and numeric scores, and turning annotations into those stays a human
   step. Every label on screen and in the export says "annotation" for that reason.

   Storage is `localStorage` under `henhouse:<run_id>:<sample_id>`, so two samples of one run never
   share flags and a feed switch swaps the whole set.
   =========================================================================== */
const marksKey = () => "henhouse:" + S.run + ":" + S.sample;
const markCount = () => Object.keys(S.marks).length;

function loadMarks() {
  S.marks = {};
  S.marksVer++;
  S.storeErr = false;
  if (!S.run || !S.sample) return;
  let raw = null;
  try { raw = window.localStorage.getItem(marksKey()); } catch (err) { return; }  // private mode
  if (!raw) return;
  let data = null;
  try { data = JSON.parse(raw); } catch (err) { return; }   // corrupt storage must not break the page
  if (!data || typeof data !== "object" || Array.isArray(data)) return;
  for (const k of Object.keys(data)) {
    const m = data[k];
    if (!m || typeof m !== "object") continue;
    S.marks[k] = {
      key: k,
      kind: String(m.kind == null ? "row" : m.kind),
      day: num(m.day) ? m.day : null,
      msg: m.msg == null ? "" : String(m.msg),
      label: m.label == null ? "" : String(m.label).slice(0, LABEL_CHARS * 2),
      note: m.note == null ? "" : String(m.note).slice(0, NOTE_MAX),
      ts: m.ts == null ? "" : String(m.ts),
    };
  }
}
function saveMarks() {
  S.marksVer++;
  if (!S.run || !S.sample) return;
  try {
    window.localStorage.setItem(marksKey(), JSON.stringify(S.marks));
    S.storeErr = false;
  } catch (err) {
    S.storeErr = true;      // quota, or storage disabled: the flags still work for this session
  }
}
/* What a painted row offers when its flag is clicked. Held in a map rather than in data-attributes
   so a long row label never lands in the DOM twice. */
function offerMark(key, kind, day, msg, label) {
  S.markInfo.set(key, { kind: kind, day: num(day) ? day : null,
                        msg: msg == null ? "" : String(msg),
                        label: cut(String(label == null ? "" : label).replace(/\s+/g, " "), LABEL_CHARS) });
  return key;
}
function flagHtml(key, marked, extra) {
  return '<button class="fl' + (marked ? " on" : "") + (extra ? " " + extra : "") +
    '" type="button" data-flag="' + esc(key) +
    '" title="' + (marked ? "edit this annotation" : "flag this row — with an optional note") +
    '" aria-label="' + (marked ? "edit annotation" : "annotate this row") + '">⚑</button>';
}

function markPut(key) {
  const info = S.markInfo.get(key) || {};
  S.marks[key] = {
    key: key, kind: String(info.kind || "row"), day: num(info.day) ? info.day : null,
    msg: info.msg == null ? "" : String(info.msg), label: info.label == null ? "" : info.label,
    note: "", ts: new Date().toISOString(),
  };
  saveMarks();
  return S.marks[key];
}
function markNote(key, text) {
  const m = S.marks[key];
  if (!m) return;
  m.note = String(text == null ? "" : text).slice(0, NOTE_MAX);
  saveMarks();
}
function markRemove(key) {
  if (!S.marks[key]) return;
  delete S.marks[key];
  saveMarks();
}

/* The reel's user rows: one per annotation that is not itself a flagged moment (a flagged moment
   lights up the moment row it already has, instead of appearing twice). */
function markRows() {
  const out = [];
  for (const k of Object.keys(S.marks)) {
    const m = S.marks[k];
    if (m.kind === "moment") continue;
    out.push({ key: "mark:" + k, markKey: k, day: num(m.day) ? m.day : 0, kind: "mark", tag: "FLAG",
               title: "⚑ " + (m.label || "flagged row"),
               text: m.note ? m.note : "no note" });
  }
  return out;
}

/* ---------- annotations.csv (spec §5.4) ----------------------------------
   Columns are fixed: run_id, sample_id, day, msg_id, note, ts. `msg_id` is the annotated row's
   anchor — the transcript message id when the feed gave the row one, otherwise the row's own stable
   id (an email id, a moment key). An empty anchor would lose which row a note was about, which is
   the one thing a hand-labeling pass cannot reconstruct afterwards.

   RFC-4180 quoting: a note is free text, so a comma, a quote or a newline in it must not shift a
   column. */
function csvCell(v) {
  const s = v == null ? "" : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
/* A cell opening with `=`, `+`, `-` or `@` is a live formula the moment Excel or Sheets opens the
   file. A leading apostrophe is the spreadsheet's own "treat this as text" marker, and it goes on
   BEFORE quoting so the guard sits inside the quotes. Only the free-text note needs this — the other
   columns are program-generated ids, days and timestamps. */
function csvNote(v) {
  const s = v == null ? "" : String(v);
  return csvCell(/^[=+\-@]/.test(s) ? "'" + s : s);
}
function annotationsCsv() {
  const rows = [["run_id", "sample_id", "day", "msg_id", "note", "ts"].join(",")];
  const list = Object.keys(S.marks).map(function (k) { return S.marks[k]; });
  // Reading order: by the day annotated, then by when it was annotated.
  list.sort(function (a, b) {
    const ad = num(a.day) ? a.day : -Infinity, bd = num(b.day) ? b.day : -Infinity;
    return (ad - bd) || String(a.ts).localeCompare(String(b.ts)) || a.key.localeCompare(b.key);
  });
  for (const m of list) {
    rows.push([csvCell(S.run), csvCell(S.sample), csvCell(num(m.day) ? m.day : ""),
               csvCell(m.msg), csvNote(m.note), csvCell(m.ts)].join(","));
  }
  return rows.join("\r\n") + "\r\n";
}
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = el("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Revoked on a later task: Firefox cancels an in-flight download if the URL dies too early.
  window.setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
}
function exportAnnotations() {
  if (!markCount()) return;
  download(new Blob([annotationsCsv()], { type: "text/csv;charset=utf-8" }), "annotations.csv");
}

/* ===========================================================================
   Painting
   =========================================================================== */
const isEmptyHouse = (h) => !num(h.bird_count) || h.bird_count <= 0;
const houseAlert = (h) => !isEmptyHouse(h) && num(h.ammonia_ppm) && h.ammonia_ppm > NH3_CEILING;

function layRate(houses) {
  let birds = 0, eggs = 0;
  for (const h of houses) {
    if (isEmptyHouse(h) || !num(h.hen_day_pct)) continue;
    birds += h.bird_count; eggs += h.bird_count * h.hen_day_pct;
  }
  return birds > 0 ? eggs / birds : null;
}
function worst(houses, key) {
  let v = null;
  for (const h of houses) {
    if (isEmptyHouse(h) || !num(h[key])) continue;
    if (v === null || h[key] > v) v = h[key];
  }
  return v;
}

function paintChrome(D) {
  const badge = $("badge"), txt = $("badgetxt");
  badge.className = "live";
  if (!S.run) { badge.classList.add("replay"); txt.textContent = "—"; }
  else if (scrubbing()) { badge.classList.add("scrub"); txt.textContent = "REPLAY OF BUFFER"; }
  else if (S.live && !D.ended) { txt.textContent = "LIVE"; }
  else { badge.classList.add("replay"); txt.textContent = "REPLAY"; }

  const m = D.meta;
  $("dayline").firstChild.nodeValue = num(D.day) ? "Day " + D.day + " " : "— ";
  const bits = [];
  if (m && num(m.last_day)) bits.push("of " + m.last_day);
  if (D.dayStart && D.dayStart.date) bits.push(D.dayStart.date);
  if (D.dayStart && D.dayStart.season) bits.push(D.dayStart.season);
  if (m && m.target) bits.push(m.target);
  $("daymeta").textContent = bits.length ? bits.join(" · ")
    : (S.run ? "waiting for the first day" : "no feed selected");

  const houses = D.snap ? (D.snap.houses || []) : [];
  const totals = (D.snap && D.snap.totals) || {};
  const fin = (D.snap && D.snap.finance) || {};
  const nh3 = worst(houses, "ammonia_ppm");
  let resolved = 0;
  for (const d of D.decisions.values()) if (d.resolved) resolved++;
  // The denominator is the run's own enabled-node count — never a hardcoded number (spec §3).
  const denom = m && num(m.enabled_nodes) ? m.enabled_nodes : null;

  const kpis = [
    ["lay rate", fmtPct(layRate(houses)), ""],
    ["eggs sold", fmtCount(totals.eggs_sold_dozen) + (num(totals.eggs_sold_dozen) ? " dz" : ""), ""],
    ["nh₃ max", num(nh3) ? fmtNum(nh3, 1) : "—", num(nh3) && nh3 > NH3_CEILING ? "warn" : ""],
    ["mort 7d", fmtRatePct(totals.mortality_rate_weekly), ""],
    ["cop/doz", fmtCents(fin.cop_cents_doz), ""],
    ["margin/doz", fmtCents(fin.margin_cents_doz),
      num(fin.margin_cents_doz) && fin.margin_cents_doz < 0 ? "warn" : ""],
    ["decisions", resolved + "/" + (denom === null ? "—" : denom), "gold"],
  ];
  $("kpis").innerHTML = kpis.map(function (k) {
    return '<div class="kpi"><div class="v ' + k[2] + '">' + esc(k[1]) +
           '</div><div class="l">' + esc(k[0]) + "</div></div>";
  }).join("");
}

function paintHero(D) {
  const hero = $("hero");
  const season = (D.dayStart && D.dayStart.season) || "";
  hero.className = "hero " + (["winter", "spring", "summer", "autumn"].indexOf(season) >= 0 ? season : "");
  const houses = D.snap ? (D.snap.houses || []) : [];
  let html = '<div class="sunball"></div><div class="treeline"></div><div class="ground"></div>';
  if (season === "winter") {
    const flakes = [[8, 4, 6, 0], [19, 3, 8, 2], [33, 4, 7, 1], [47, 2.5, 9, 3],
                    [58, 4, 6.5, 0.5], [71, 3, 8.5, 2.4], [84, 4, 7.2, 1.6], [93, 3, 6.8, 0.9]];
    for (const f of flakes) {
      html += '<div class="flake" style="left:' + f[0] + "%; width:" + f[1] + "px; height:" + f[1] +
              "px; animation-duration:" + f[2] + "s; animation-delay:" + f[3] + 's;"></div>';
    }
  }
  const wx = D.dayStart && D.dayStart.weather;
  if (wx && typeof wx === "object") {
    const parts = [];
    if (num(wx.high_c)) parts.push("high " + cToF(wx.high_c) + "°F");
    if (num(wx.low_c)) parts.push("low " + cToF(wx.low_c) + "°F");
    if (num(wx.rh_pct)) parts.push("RH " + Math.round(wx.rh_pct) + "%");
    if (parts.length) html += '<div class="wx">' + esc(parts.join(" · ")) + "</div>";
  }
  if (!houses.length) html += '<div class="heronote">no farm state in the feed yet</div>';

  const n = houses.length;
  houses.forEach(function (h, i) {
    const left = ((i + 0.5) * 100 / n).toFixed(2) + "%";
    const empty = isEmptyHouse(h);
    const cls = ["barnw"];
    if (empty) cls.push("off");
    if (houseAlert(h)) cls.push("alert");
    if (S.house === h.house_id) cls.push("sel");
    html += '<div class="' + cls.join(" ") + '" style="left:' + left + '" data-house="' + esc(h.house_id) +
            '" role="button" tabindex="0" title="cutaway — ' + esc(h.house_id) + '">' +
            '<div class="struct"></div>' + (season === "winter" ? '<div class="snowcap"></div>' : "") +
            '<div class="loft"></div><div class="doors"></div><div class="glow"></div></div>';
    let chip;
    if (empty) chip = "<b>" + esc(h.house_id) + "</b> empty";
    else {
      const a = num(h.ammonia_ppm) ? fmtNum(h.ammonia_ppm, 0) + "ppm" : "—";
      chip = "<b>" + esc(h.house_id) + "</b> " + fmtCount(h.bird_count) + " · " +
             (num(h.hen_day_pct) ? Math.round(h.hen_day_pct) + "%" : "—") + " · " +
             (houseAlert(h) ? '<span class="bad">' + a + " ⚠</span>" : a);
    }
    html += '<div class="bchip" style="left:' + left + '">' + chip + "</div>";
    // A hen in the yard BETWEEN two barns (never on one), for every second populated house.
    if (!empty && i % 2 === 0 && i < n - 1) {
      const hl = ((i + 1) * 100 / n).toFixed(2);
      html += '<div class="henw" style="left:' + hl + "%; transform:scale(" +
              (0.82 + (i % 3) * 0.09).toFixed(2) + ')"><i style="animation-delay:' +
              ((i * 0.37) % 1.6).toFixed(2) + 's"></i></div>';
    }
  });
  hero.innerHTML = html;
}

function paintCutaway(D) {
  const wrap = $("cutwrap");
  const houses = D.snap ? (D.snap.houses || []) : [];
  const h = S.house ? houses.find(function (x) { return x.house_id === S.house; }) : null;
  if (!h) { wrap.hidden = true; $("cut").innerHTML = ""; return; }
  wrap.hidden = false;

  // Every label here is feed data: the house id, the breed label the run carries, its own numbers.
  const breed = (D.meta && D.meta.breed_label) || null;
  const head = [];
  if (!isEmptyHouse(h)) {
    // Flock facts describe a flock: with no birds placed, breed and age say nothing.
    head.push(fmtCount(h.bird_count) + " hens");
    if (breed) head.push(breed);
    if (num(h.age_weeks)) head.push("wk " + fmtNum(h.age_weeks, 0));
    if (h.egg_disposition) head.push(String(h.egg_disposition));
  }

  const vent = num(h.ventilation) ? h.ventilation : 0;
  const spin = 1.6 / clamp(vent, 0.15, 3);
  const hazeOp = clamp(num(h.ammonia_ppm) ? h.ammonia_ppm / NH3_CEILING : 0, 0.08, 1);
  const wet = clamp(num(h.litter_moisture) ? h.litter_moisture * 1.6 : 0, 0, 100);

  const rows = [];
  const row = function (label, value, cls) {
    rows.push('<div class="row"><span>' + esc(label) + '</span><b class="' + (cls || "") + '">' +
              value + "</b></div>");
  };
  if (num(h.ammonia_ppm)) {
    row("NH₃" + (h.has_nh3_sensor === false ? " (no sensor)" : ""),
        esc(fmtNum(h.ammonia_ppm, 1) + " ppm" + (h.ammonia_ppm > NH3_CEILING ? " ⚠" : "")),
        h.ammonia_ppm > NH3_CEILING ? "warn" : "ok");
  }
  // A water fault outranks every reading below it, so it sits directly under the NH₃ line.
  if (h.water_access_ok === false) row("water access", "INTERRUPTED", "warn");
  if (num(h.co2_ppm)) row("CO₂", esc(fmtNum(h.co2_ppm, 0) + " ppm"));
  if (num(h.temp_c)) row("temp", esc(cToF(h.temp_c) + "°F · " + fmtNum(h.temp_c, 1) + "°C"));
  if (num(h.humidity)) row("humidity", esc(fmtNum(h.humidity, 0) + "%"));
  if (num(h.ventilation)) row("vent", esc(fmtPct(h.ventilation * 100, 0)));
  if (num(h.litter_moisture)) row("litter moisture", esc(fmtNum(h.litter_moisture, 1) + "%"));
  if (num(h.stocking_density)) row("stocking", esc(fmtNum(h.stocking_density, 1) + " in²/hen"));
  if (num(h.hen_day_pct)) row("hen-day rate", esc(fmtPct(h.hen_day_pct, 1)));
  if (num(h.footpad_affected_pct)) row("footpad affected", esc(fmtPct(h.footpad_affected_pct, 1)));
  if (num(h.keel_fracture_pct)) row("keel fracture", esc(fmtPct(h.keel_fracture_pct, 1)));
  if (num(h.feather_damage_pct)) row("feather damage", esc(fmtPct(h.feather_damage_pct, 1)));
  if (num(h.red_mite_index)) row("red-mite index", esc(fmtNum(h.red_mite_index, 2)));
  if (num(h.lighting_lux)) {
    row("light", esc(fmtNum(h.lighting_lux, 0) + " lx · " + fmtNum(h.lighting_hours, 0) + " h"));
  }

  let shell;
  if (isEmptyHouse(h)) {
    shell = '<div class="vacant">no flock placed</div>' +
            '<div class="floor"><i style="width:' + wet.toFixed(0) + '%"></i></div>';
  } else {
    shell =
      '<div class="fan" style="top:18px"><i style="animation-duration:' + spin.toFixed(2) + 's"></i></div>' +
      '<div class="fan" style="top:76px"><i style="animation-duration:' + (spin * 1.15).toFixed(2) + 's"></i></div>' +
      '<div class="fan" style="top:134px"><i style="animation-duration:' + (spin * 0.86).toFixed(2) + 's"></i></div>' +
      '<div class="tier" data-n="T3" style="top:42px"></div>' +
      '<div class="tier" data-n="T2" style="top:88px"></div>' +
      '<div class="tier" data-n="T1" style="top:134px"></div>' +
      '<div class="haze" style="opacity:' + hazeOp.toFixed(2) + '"></div>' +
      '<div class="floor"><i style="width:' + wet.toFixed(0) + '%"></i></div>' +
      '<div class="hd2 j" style="bottom:26px; left:13%"></div><div class="hd2" style="bottom:26px; left:29%"></div>' +
      '<div class="hd2 j" style="bottom:26px; left:48%; animation-delay:1.5s"></div>' +
      '<div class="hd2" style="bottom:26px; left:64%"></div><div class="hd2" style="top:36px; left:35%"></div>' +
      '<div class="hd2" style="top:82px; left:57%"></div><div class="hd2" style="top:128px; left:22%"></div>';
  }
  $("cut").innerHTML =
    '<div class="hd">HOUSE ' + esc(h.house_id) + " · CUTAWAY — <b>" +
    esc(head.join(" · ") || "no flock placed") + "</b></div>" +
    '<button class="close" type="button" id="cutclose">[esc] close</button>' +
    '<div class="cshell">' + shell + "</div>" +
    '<div class="cstats">' + rows.join("") + "</div>";
  $("cutclose").addEventListener("click", function () { S.house = null; render(true); });
}

function mailRows(D) {
  const all = Array.from(D.mail.values());
  const rows = S.tab === "in" ? all.filter(function (m) { return m.dir === "in"; })
             : S.tab === "out" ? all.filter(function (m) { return m.dir === "out"; })
             : all;
  // Newest first: by in-world day, then by the order the feed announced them.
  rows.sort(function (a, b) { return (b.day - a.day) || (b.seq - a.seq); });
  return rows;
}
/* The open message is always one of the rows currently listed: switching tabs must not leave
   the reading pane showing something the list no longer offers. */
function selectedEmail(D, rows) {
  const shown = function (id) { return rows.some(function (m) { return m.id === id; }); };
  if (S.follow && D.focus && shown(D.focus)) return D.mail.get(D.focus);
  if (S.picked && shown(S.picked)) return D.mail.get(S.picked);
  return rows[0] || null;
}

function paintMail(D) {
  const inbox = D.mail.size - D.sent;
  $("mailtabs").innerHTML =
    '<button type="button" data-tab="all" class="' + (S.tab === "all" ? "on" : "") + '">All ' + D.mail.size + "</button>" +
    '<button type="button" data-tab="in" class="' + (S.tab === "in" ? "on" : "") + '">Inbox ' + inbox +
      (D.unread ? " " + D.unread + "●" : "") + "</button>" +
    '<button type="button" data-tab="out" class="' + (S.tab === "out" ? "on" : "") + '">Sent ' + D.sent + "</button>";
  const fb = $("followbtn");
  fb.className = "follow" + (S.follow ? "" : " off");
  fb.textContent = S.follow ? "FOLLOWING AGENT" : "FOLLOW AGENT";

  const rows = mailRows(D);
  const sel = selectedEmail(D, rows);
  const list = $("mlist");
  const keep = list.scrollTop;
  list.innerHTML = rows.map(function (m) {
    const cls = ["mrow"];
    if (m.dir === "out") cls.push("sent");
    else if (m.readDay === null) cls.push("unread");
    if (sel && sel.id === m.id) cls.push("cur");
    const who = m.dir === "out" ? "↩ to " + m.who : m.who;
    const eye = m.dir === "in" && m.readDay !== null
      ? ' <span title="read by the agent on day ' + esc(m.readDay) + '">👁</span>' : "";
    // A mail row's annotation anchor is the mail's own id — there is no transcript message id for
    // a delivered email, and an empty anchor would lose which mail was flagged.
    const key = offerMark("mail:" + m.id, "mail", m.day, m.id,
                          (m.dir === "out" ? "sent to " : "mail from ") + m.who + " — " +
                          (m.subject || "(no subject)"));
    if (S.marks[key]) cls.push("marked");
    return '<div class="' + cls.join(" ") + '" data-mail="' + esc(m.id) + '">' +
           '<span class="t">' + esc(num(m.day) ? "d" + m.day : "") + "</span>" +
           '<span class="f">' + flagHtml(key, !!S.marks[key]) + esc(cut(who, 28)) + eye + "</span>" +
           '<span class="s">' + esc(cut(m.subject || "(no subject)", 60)) + "</span></div>";
  }).join("") || '<div class="empty">no mail yet</div>';
  list.scrollTop = keep;

  const body = $("mbody");
  body.className = "mbody" + (sel && sel.dir === "out" ? " out" : "");
  if (!sel) { body.innerHTML = '<div class="empty">nothing to read yet.</div>'; return; }
  const meta = [(sel.dir === "out" ? "to " : "from ") + sel.who];
  if (num(sel.day)) meta.push("day " + sel.day);
  if (sel.ts) meta.push(sel.ts);
  if (sel.dir === "in" && sel.readDay !== null) meta.push("read by the agent on day " + sel.readDay);
  if (S.follow) meta.push(sel.dir === "out" ? "auto-opened on send (follow mode)" : "auto-opened on read (follow mode)");
  let text = sel.body;
  if (text == null && S.bodies[sel.id] != null) text = S.bodies[sel.id];
  body.innerHTML =
    '<div class="mh"><b>' + esc(sel.subject || "(no subject)") + "</b>" +
    (sel.dir === "out" ? '<span class="authored">✍ WRITTEN BY AGENT</span>' : "") +
    '<span class="meta">' + esc(meta.join(" · ")) + "</span></div>" +
    (text == null ? '<p class="empty">body not carried in this feed — asking the server…</p>'
     : text === "" ? '<p class="empty">(empty body)</p>' : "<p>" + esc(text) + "</p>");
  if (text == null) fetchBody(sel.id);
}

const fetching = new Set();
async function fetchBody(id) {                 // /email is the documented fallback for a missing body
  if (fetching.has(id) || S.bodies[id] != null || !S.run) return;
  const gen = S.gen;                           // this body belongs to the feed selected right now
  fetching.add(id);
  let body = "";
  try {
    const data = await api("/email?" + feedQuery() + "&id=" + encodeURIComponent(id));
    if (typeof data.body === "string") body = data.body;
  } catch (err) {
    body = "";                                 // a 404 means the feed never carried this one
  } finally {
    fetching.delete(id);
    // A feed switch clears S.bodies; caching this one under the new feed would put the old feed's
    // text on a same-id mail, and the repaint would be for a feed nobody is watching.
    if (gen === S.gen) {
      S.bodies[id] = body;
      render(true);
    }
  }
}

function paintFeed(D) {
  const box = $("feed");
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 24;
  const rows = D.rows.slice(-FEED_ROWS_MAX);
  box.innerHTML = rows.map(function (r) {
    if (r.t === "day") {
      return '<div class="ev day">· · · day ' + esc(r.day) +
             (r.date ? " · " + esc(r.date) : "") + (r.season ? " · " + esc(r.season) : "") + " · · ·</div>";
    }
    if (r.t === "end") return '<div class="ev end">· · · episode end · ' + esc(r.status) + " · · ·</div>";
    // Only content rows are annotatable, and only when the feed gave the row an identity of its
    // own: day and episode-end separators are punctuation, not something to flag.
    const key = num(r.seq) ? offerMark("ev:" + r.seq, r.t === "think" ? "text" : "tool", r.day, r.msg,
                                       r.t === "think" ? "agent: " + r.text
                                                       : "tool: " + r.tool + "()") : null;
    const marked = key !== null && !!S.marks[key];
    const flag = key === null ? "" : flagHtml(key, marked);
    if (r.t === "think") {
      return '<div class="ev think' + (marked ? " marked" : "") + '">' + flag +
             (r.reasoning ? '<span class="rm" title="model reasoning">ᴿ</span>' : "") +
             esc(cut(r.text, TEXT_CHARS)) + "</div>";
    }
    const args = r.args && typeof r.args === "object"
      ? Object.keys(r.args).map(function (k) {
          const v = r.args[k];
          return esc(k) + "=" + esc(cut(typeof v === "string" ? v : JSON.stringify(v), ARG_CHARS));
        }).join(", ")
      : "";
    // A service charge is money out: render it signed, the way the ledger sees it.
    const cost = num(r.cost)
      ? '<span class="cost">' + esc(fmtMoney(-Math.abs(r.cost) / 100)) + "</span>" : "";
    const res = r.result
      ? '<span class="res"> → ' + esc(cut(String(r.result).replace(/\s+/g, " "), RESULT_CHARS)) + "</span>" : "";
    return '<div class="ev' + (num(r.cost) ? " act" : "") + (marked ? " marked" : "") + '">' + cost +
           flag + '<span class="tm">d' + esc(r.day) + "</span><b>" + esc(r.tool) + "</b>(" + args + ")" +
           res + "</div>";
  }).join("") || '<div class="empty">no agent activity yet</div>';
  // Follow the tail only when the reader was already AT the tail: someone reading scrollback keeps
  // their place, live or scrubbing. (`|| !scrubbing()` made the atBottom test dead in live mode and
  // yanked the box down on every poll.)
  if (atBottom) box.scrollTop = box.scrollHeight;
  $("feedmeta").textContent = (D.turns ? "turn " + D.turns : "") +
    (D.toolsToday ? " · " + D.toolsToday + " tool" + (D.toolsToday === 1 ? "" : "s") + " today" : "");
}

function gaugeRow(label, value, frac, tone) {
  return '<div class="gl"><span>' + esc(label) + "</span><b>" + esc(value) + "</b></div>" +
         '<div class="gb"><div class="gf ' + tone + '" style="width:' +
         clamp(frac * 100, 0, 100).toFixed(0) + '%"></div></div>';
}
function paintRail(D) {
  const houses = D.snap ? (D.snap.houses || []) : [];
  const totals = (D.snap && D.snap.totals) || {};
  const harm = totals.harm || {};
  const fin = (D.snap && D.snap.finance) || {};

  let g;
  if (!D.snap) g = '<div class="empty">no snapshot yet</div>';
  else {
    const tone = function (v, warn, mid) { return v === null ? "g" : v >= warn ? "r" : v >= mid ? "y" : "g"; };
    const nh3 = worst(houses, "ammonia_ppm");
    const litter = worst(houses, "litter_moisture");
    const footpad = worst(houses, "footpad_affected_pct");
    const feather = worst(houses, "feather_damage_pct");
    const mort = num(totals.mortality_rate_weekly) ? totals.mortality_rate_weekly : null;
    g = gaugeRow("NH₃ worst house",
                 num(nh3) ? fmtNum(nh3, 1) + " ppm" + (nh3 > NH3_CEILING ? " ⚠" : "") : "—",
                 num(nh3) ? nh3 / (NH3_CEILING * 1.2) : 0,
                 tone(nh3, NH3_CEILING, NH3_CEILING * 0.7));
    const sn = D.snaps.slice(-SPARK_BARS).map(function (s) { return worst(s.houses || [], "ammonia_ppm"); });
    if (sn.length > 1) {
      const top = Math.max.apply(null, [NH3_CEILING * 1.1].concat(sn.filter(num)));
      g += '<div class="spark">' + sn.map(function (v) {
        return '<i class="' + (num(v) && v > NH3_CEILING ? "hot" : "") + '" style="height:' +
               clamp(num(v) ? (v / top) * 100 : 2, 2, 100).toFixed(0) + '%"></i>';
      }).join("") + "</div>" +
        '<div class="sparkl"><span>NH₃ worst · last ' + sn.length + " snapshots</span><span>ceiling " +
        NH3_CEILING + "</span></div>";
    }
    g += gaugeRow("litter moisture", num(litter) ? fmtNum(litter, 1) + "%" : "—",
                  num(litter) ? litter / 45 : 0, tone(litter, 32, 26));
    g += gaugeRow("footpad affected", fmtPct(footpad, 1), num(footpad) ? footpad / 40 : 0, tone(footpad, 20, 10));
    g += gaugeRow("feather damage", fmtPct(feather, 1), num(feather) ? feather / 100 : 0, tone(feather, 50, 25));
    g += gaugeRow("mortality 7d", fmtRatePct(mort), num(mort) ? mort / 0.01 : 0,
                  tone(mort, MORT_WARN, MORT_MID));
    if (num(harm.nh3_ppm_hours_over) || num(harm.heat_stress_hours)) {
      g += '<div class="gl"><span>harm hours · NH₃ / heat</span><b>' +
           esc(fmtCount(harm.nh3_ppm_hours_over) + " / " + fmtCount(harm.heat_stress_hours)) + "</b></div>";
    }
  }
  $("gauges").innerHTML = g;
  $("welfmeta").textContent = D.snap && num(D.snap.day) ? "snapshot d" + D.snap.day : "";

  const f = [];
  const line = function (l, v, cls) {
    f.push('<div class="row"><span>' + esc(l) + '</span><b class="' + (cls || "") + '">' + esc(v) + "</b></div>");
  };
  if (!D.snap) f.push('<div class="empty">no snapshot yet</div>');
  else {
    line("COP", fmtCents(fin.cop_cents_doz) + "/doz");
    line("margin", fmtCents(fin.margin_cents_doz) + "/doz",
         num(fin.margin_cents_doz) ? (fin.margin_cents_doz >= 0 ? "up" : "dn") : "");
    line("margin cum.", fmtMoney(fin.margin), num(fin.margin) ? (fin.margin >= 0 ? "up" : "dn") : "");
    line("egg price", num(fin.egg_price_usd_doz) ? "$" + fin.egg_price_usd_doz.toFixed(2) + "/doz" : "—");
    line("ration", num(fin.layer_ration_usd_ton) ? "$" + fmtCount(fin.layer_ration_usd_ton) + "/t" : "—");
    if (num(fin.sellable_dozen_cum) && num(fin.downgrade_dozen_cum)) {
      const tot = fin.sellable_dozen_cum + fin.downgrade_dozen_cum;
      line("grade-A share", tot > 0 ? fmtPct((fin.sellable_dozen_cum / tot) * 100, 1) : "—");
    }
    line("birds alive", fmtCount(totals.birds_alive));
    line("mortality cum.", fmtCount(totals.mortality_cumulative));
  }
  $("fin").innerHTML = f.join("");

  // --- L8 credit & payables (finance_snapshot) ---------------------------------------
  // Written only when the feed carries the axis. Both targets are cleared otherwise, so
  // scrubbing back to a day before the first finance_snapshot removes the block again.
  const fs = D.finsnap;
  const l8 = [];
  const l8line = function (l, v, cls) {
    l8.push('<div class="row"><span>' + esc(l) + '</span><b class="' + (cls || "") + '">' + esc(v) + "</b></div>");
  };
  if (fs) {
    l8line("cash", fmtMoney(fs.cash));
    l8line("line drawn", fmtMoney(fs.drawn), num(fs.drawn) && fs.drawn > 0 ? "dn" : "");
    l8line("interest paid", fmtMoney(fs.interest_paid));
    l8line("lender", fs.lender_name || fs.active_lender || "—");
    const inv = fs.open_invoices || [];
    const off = fs.open_offers || [];
    l8line("open statements", inv.length ? String(inv.length) : "none");
    for (const row of inv) {
      l8line("· " + (row.vendor || row.invoice_id) +
             (num(row.net_day) ? " (net d" + row.net_day + ")" : ""),
             fmtMoney(row.amount_usd) + (row.queried_lines ? " · " + row.queried_lines + " queried" : ""));
    }
    l8line("open proposals", off.length ? String(off.length) : "none");
    for (const row of off) {
      l8line("· " + (row.vendor || row.offer_id),
             (num(row.options) ? row.options + " option" + (row.options === 1 ? "" : "s") : "—") +
             (num(row.expires_day) ? " · expires d" + row.expires_day : ""));
    }
  }
  $("finl8head").innerHTML = fs
    ? '<div class="ph" style="border-top:1px solid var(--line)"><span class="pt">Credit &amp; payables</span>' +
      '<span class="pm">' + esc(num(fs.day) ? "d" + fs.day : "") + "</span></div>"
    : "";
  $("finl8").innerHTML = l8.join("");
}

function paintDecisions(D) {
  const list = Array.from(D.decisions.values()).sort(function (a, b) {
    return (a.opens - b.opens) || String(a.dp_id).localeCompare(String(b.dp_id));
  });
  const now = D.day;
  $("ledger").innerHTML = list.map(function (d) {
    let cls, label;
    if (d.tripwire) { cls = "trip"; label = "TRIPWIRE"; }
    else if (d.resolved) { cls = "done"; label = "✓ SCORE PENDING"; }
    else if (num(d.deadline) && num(now) && now > d.deadline) { cls = "miss"; label = "UNNOTICED"; }
    else { cls = "open"; label = "OPEN → d" + (num(d.deadline) ? d.deadline : "?"); }
    const tail = [];
    if (d.resolved && d.outcome) tail.push(String(d.outcome));
    if (num(d.latency)) tail.push("+" + d.latency + "d");
    return '<div class="ledgrow"><span class="badge ' + cls + '">' + esc(label) + "</span>" +
           '<span class="dpn">' + esc(d.dp_id) + "</span>" +
           (tail.length ? '<span class="lat">' + esc(tail.join(" · ")) + "</span>" : "") + "</div>";
  }).join("") || '<div class="empty">no decision windows open yet</div>';
}

function paintTimeline(D) {
  const sp = span(D);
  const pos = function (day) { return clamp(((day - sp.first) / (sp.last - sp.first)) * 100, 0, 100); };
  const at = num(D.day) ? D.day : sp.first;

  $("tlfill").style.width = pos(at).toFixed(2) + "%";
  $("tlcursor").style.left = pos(at).toFixed(2) + "%";

  const bar = $("tlbar");
  Array.prototype.forEach.call(bar.querySelectorAll(".tick"), function (t) { t.remove(); });
  D.decisions.forEach(function (d) {
    if (!num(d.opens)) return;
    const t = el("div", "tick" + (d.tripwire ? " trip" : d.resolved ? " done" : ""));
    t.style.left = pos(d.opens).toFixed(2) + "%";
    t.dataset.day = String(d.opens);
    t.title = d.dp_id + " · opens d" + d.opens + (num(d.deadline) ? " · deadline d" + d.deadline : "") +
              (d.resolved ? " · resolved" + (d.outcome ? " (" + d.outcome + ")" : "") : " · open");
    bar.appendChild(t);
  });

  // Season labels come off the day_start events actually seen — never a hardcoded calendar.
  const marks = [];
  let last = null;
  for (const r of D.rows) {
    if (r.t !== "day" || !r.season) continue;
    if (r.season !== last) { marks.push(r); last = r.season; }
  }
  $("seasons").innerHTML = marks.map(function (k, i) {
    return '<span class="' + (i === marks.length - 1 ? "now" : "") + '" style="left:' +
           pos(k.day).toFixed(2) + '%">' + esc(k.season) + "</span>";
  }).join("") || '<span style="left:0">day ' + sp.first + "</span>";
  $("livebtn").className = scrubbing() ? "" : "on";
}

/* ===========================================================================
   Extras — charts (§5.1), moment toasts + reel (§5.2), run-health strip (§5.3)
   =========================================================================== */

/* Bird-weighted mean flock age. The breed table is indexed by age, so the reference curve has
   to be read at the age the flock actually is; with no age in the feed there is no curve
   (nothing is invented, and no breed number is ever hardcoded here). */
function meanAge(houses) {
  let birds = 0, sum = 0;
  for (const h of houses) {
    if (isEmptyHouse(h) || !num(h.age_weeks)) continue;
    birds += h.bird_count; sum += h.bird_count * h.age_weeks;
  }
  return birds > 0 ? sum / birds : null;
}
/* Linear interpolation over run_meta.breed_standard — a list of [age_wk, hen-day %] pairs. Off
   the ends of the table it returns null rather than extrapolating a standard the run never
   published. */
function breedRefAt(pairs, age) {
  if (!Array.isArray(pairs) || !num(age)) return null;
  const pts = pairs.filter(function (p) { return Array.isArray(p) && num(p[0]) && num(p[1]); })
    .slice().sort(function (a, b) { return a[0] - b[0]; });
  if (!pts.length || age < pts[0][0] || age > pts[pts.length - 1][0]) return null;
  for (let i = 1; i < pts.length; i++) {
    if (age <= pts[i][0]) {
      const x0 = pts[i - 1][0], y0 = pts[i - 1][1], x1 = pts[i][0], y1 = pts[i][1];
      return x1 === x0 ? y1 : y0 + ((age - x0) / (x1 - x0)) * (y1 - y0);
    }
  }
  return pts[pts.length - 1][1];
}

/* One measure per chart — never a second y-scale (spec §5.1). `at` reads one snapshot; the
   colours are the validated slots declared at the top of the file. */
const CHART_DEFS = [
  { key: "nh3", title: "Ammonia — worst house", unit: "ppm", color: "var(--c-nh3)", digits: 1,
    wide: true, ceiling: NH3_CEILING,
    at: function (s) { return worst(s.houses || [], "ammonia_ppm"); } },
  // `refTitle` is used only when the run actually published a usable standard curve.
  { key: "lay", title: "Lay rate", refTitle: "Lay rate vs. breed standard", unit: "%",
    color: "var(--c-lay)", digits: 1, ref: true,
    at: function (s) { return layRate(s.houses || []); } },
  { key: "litter", title: "Litter moisture — worst house", unit: "%", color: "var(--c-litter)", digits: 1,
    at: function (s) { return worst(s.houses || [], "litter_moisture"); } },
  { key: "mort", title: "Mortality — 7-day rate", unit: "%", color: "var(--c-mort)", digits: 3,
    at: function (s) {
      const t = s.totals || {};
      return num(t.mortality_rate_weekly) ? t.mortality_rate_weekly * 100 : null;
    } },
  { key: "cop", title: "Cost of production", unit: "¢/doz", color: "var(--c-cop)", digits: 1,
    at: function (s) {
      const f = s.finance || {};
      return num(f.cop_cents_doz) ? f.cop_cents_doz : null;
    } },
];
const CHARTS = {};      // key -> the painted chart's geometry, so the crosshair can read it back

function chartSeries(D, def) {
  const std = D.meta ? D.meta.breed_standard : null;
  const pts = [];
  for (const s of D.snaps) {
    if (!num(s.day)) continue;
    const v = def.at(s);
    pts.push({ day: s.day, v: num(v) ? v : null,
               ref: def.ref ? breedRefAt(std, meanAge(s.houses || [])) : null });
  }
  return pts;
}

function chartCard(D, def, d0, d1, beats) {
  const pts = chartSeries(D, def);
  const cls = "chart" + (def.wide ? " wide" : "");
  // A reference curve is only claimed when the run published one AND it covers this flock's age;
  // otherwise the chart is a plain single-series chart, with no legend for an undrawn line.
  const hasRef = !!def.ref && pts.some(function (p) { return num(p.ref); });
  const refLabel = (D.meta && D.meta.breed_label)
    ? D.meta.breed_label + " standard" : "breed standard";
  const title = hasRef && def.refTitle ? def.refTitle : def.title;
  const vals = [];
  for (const p of pts) { if (num(p.v)) vals.push(p.v); if (num(p.ref)) vals.push(p.ref); }
  if (!vals.length || d0 === null) {
    delete CHARTS[def.key];
    return '<div class="' + cls + '"><div class="ct"><b>' + esc(title) + '</b><span>' +
      esc(def.unit) + '</span></div><div class="chartnote">no snapshot data in the feed yet</div></div>';
  }
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  // The ceiling is part of the story, so keep it (and a little air above it) inside the frame.
  if (num(def.ceiling)) { hi = Math.max(hi, def.ceiling * 1.08); lo = Math.min(lo, def.ceiling * 0.9); }
  // A dead-flat series still needs a domain. Padding never crosses zero for a measure the feed
  // only ever reports as non-negative: a "−1.000 %" mortality axis would be a lie about the scale.
  if (hi - lo < 1e-9) {
    const pad = Math.max(1, Math.abs(hi) * 0.05);
    hi += pad;
    lo = lo >= 0 ? Math.max(0, lo - pad) : lo - pad;
  }
  const xOf = function (day) { return d1 === d0 ? CW / 2 : ((day - d0) / (d1 - d0)) * CW; };
  const yOf = function (v) { return CH - CPAD - ((v - lo) / (hi - lo)) * (CH - 2 * CPAD); };

  // Vertical strokes stretch with the viewBox, so every stroke opts out with non-scaling-stroke.
  let svg = '<svg viewBox="0 0 ' + CW + " " + CH + '" preserveAspectRatio="none" aria-hidden="true">';
  let ceilY = null;
  if (num(def.ceiling) && def.ceiling >= lo && def.ceiling <= hi) {
    ceilY = yOf(def.ceiling);
    svg += '<rect x="0" y="0" width="' + CW + '" height="' + ceilY.toFixed(2) + '" fill="#e56a5e14"/>' +
      '<line x1="0" y1="' + ceilY.toFixed(2) + '" x2="' + CW + '" y2="' + ceilY.toFixed(2) +
      '" style="stroke:var(--red)" stroke-width="1" stroke-dasharray="4 3" opacity=".75"' +
      ' vector-effect="non-scaling-stroke"/>';
  }
  svg += '<line x1="0" y1="' + (CH - 0.5) + '" x2="' + CW + '" y2="' + (CH - 0.5) +
    '" style="stroke:var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>';
  for (const b of beats) {
    if (b.day < d0 || b.day > d1) continue;
    const bx = xOf(b.day).toFixed(2);
    svg += '<line x1="' + bx + '" y1="0" x2="' + bx + '" y2="' + CH +
      '" style="stroke:var(--gold)" stroke-width="1.5" opacity=".45" vector-effect="non-scaling-stroke"/>';
  }
  // A null value breaks the line rather than bridging a gap the feed never reported.
  const lines = function (field, style, dash) {
    let out = "", cur = [];
    const flush = function () {
      if (cur.length > 1) {
        // The reference curve is thinner than the measured one, so the eye reads which is which
        // before it reads the legend.
        out += '<polyline fill="none" points="' + cur.join(" ") + '" style="' + style +
          '" stroke-width="' + (dash ? "1.5" : "2") +
          '" stroke-linejoin="round" stroke-linecap="round"' +
          (dash ? ' stroke-dasharray="5 4"' : "") + ' vector-effect="non-scaling-stroke"/>';
      }
      cur = [];
    };
    for (const p of pts) {
      if (num(p[field])) cur.push(xOf(p.day).toFixed(2) + "," + yOf(p[field]).toFixed(2));
      else flush();
    }
    flush();
    return out;
  };
  if (hasRef) svg += lines("ref", "stroke:var(--dim)", true);
  svg += lines("v", "stroke:" + def.color, false);
  svg += "</svg>";

  // Every label is HTML on top of the SVG. The SVG's CSS height equals its viewBox height, so a
  // y value is a pixel offset; x is a percentage, because that axis is the one that stretches.
  let over = "";
  if (ceilY !== null) {
    over += '<span class="lab red" style="left:4px; top:' + (ceilY + 2).toFixed(1) + 'px">' +
      esc(def.ceiling + " " + def.unit + " ceiling") + "</span>";
  }
  let last = -1;
  for (let i = pts.length - 1; i >= 0; i--) { if (num(pts[i].v)) { last = i; break; } }
  if (last >= 0) {
    const xf = xOf(pts[last].day) / CW, y = yOf(pts[last].v);
    // Right-anchored the label sits clear of the endpoint dot rather than under it.
    over += '<span class="lab" style="' +
      (xf > 0.6 ? "right:13px; top:" + clamp(y - 6, 0, CH - 12).toFixed(1)
                : "left:calc(" + (xf * 100).toFixed(2) + "% + 9px); top:" +
                  clamp(y - 13, 0, CH - 13).toFixed(1)) + 'px">' +
      esc(fmtNum(pts[last].v, def.digits)) + "</span>" +
      '<span class="lab" style="left:calc(' + (xf * 100).toFixed(2) + '% - 3px); top:' +
      (y - 3).toFixed(1) + 'px; width:6px; height:6px; border-radius:50%; background:' +
      def.color + '"></span>';
  }
  over += '<span class="lab dim" style="left:2px; bottom:1px">d' + esc(d0) + "</span>" +
    '<span class="lab dim" style="right:2px; bottom:1px">d' + esc(d1) + "</span>";

  // Two series means a legend, keyed with a stroke of the series colour (a legend mirrors the
  // mark). The label is whatever the run carried; a feed without one says only "breed standard".
  let leg = "";
  if (hasRef) {
    leg = '<div class="cleg"><span><i style="border-top-color:' + def.color + '"></i>lay rate</span>' +
      '<span><i class="ref"></i>' + esc(refLabel) + "</span></div>";
  }

  CHARTS[def.key] = { pts: pts, d0: d0, d1: d1, lo: lo, hi: hi, def: def, beats: beats,
                      hasRef: hasRef, refLabel: refLabel };
  return '<div class="' + cls + '">' +
    '<div class="ct"><b>' + esc(title) + '</b><span>' + esc(def.unit) + " · " +
    esc(fmtNum(lo, def.digits) + "–" + fmtNum(hi, def.digits)) + "</span></div>" +
    '<div class="plot" tabindex="0" role="img" data-chart="' + esc(def.key) + '" aria-label="' +
    esc(title + " — " + def.unit + ", days " + d0 + " to " + d1) + '">' +
    svg + over + '<div class="xhair"></div><div class="ctip"></div></div>' + leg + "</div>";
}

function paintCharts(D) {
  if (S.view !== "charts") return;    // hidden: a repaint nobody can see is pure cost
  const days = [];
  for (const s of D.snaps) if (num(s.day)) days.push(s.day);
  const d0 = days.length ? Math.min.apply(null, days) : null;
  const d1 = days.length ? Math.max.apply(null, days) : null;
  const beats = [];
  D.decisions.forEach(function (d) { if (num(d.opens)) beats.push({ day: d.opens, dp_id: d.dp_id }); });
  beats.sort(function (a, b) { return a.day - b.day; });
  $("charts").innerHTML = CHART_DEFS.map(function (def) {
    return chartCard(D, def, d0, d1, beats);
  }).join("");
  // A poll rebuilt the cards under the pointer; put the crosshair back where it was.
  if (S.hover && CHARTS[S.hover.key]) {
    const plot = $("charts").querySelector('[data-chart="' + S.hover.key + '"]');
    const c = CHARTS[S.hover.key];
    if (plot && c.pts.length) showHover(plot, S.hover.key, clamp(S.hover.i, 0, c.pts.length - 1));
  } else {
    S.hover = null;
  }
}

function showHover(plot, key, i) {
  const c = CHARTS[key];
  if (!c) return;
  const p = c.pts[i];
  if (!p) return;
  S.hover = { key: key, i: i };
  const xf = c.d1 === c.d0 ? 0.5 : (p.day - c.d0) / (c.d1 - c.d0);
  const hair = plot.querySelector(".xhair"), tip = plot.querySelector(".ctip");
  if (!hair || !tip) return;
  hair.style.left = (xf * 100).toFixed(3) + "%";
  hair.style.display = "block";
  // Value leads, label follows (the legend's hierarchy inverted — here the reader wants the number).
  let html = '<span style="color:var(--faint)">day ' + esc(p.day) + "</span>" +
    "<b><span class=\"k\" style=\"background:" + c.def.color + '"></span>' +
    esc(num(p.v) ? fmtNum(p.v, c.def.digits) + " " + c.def.unit : "no reading") + "</b>";
  if (c.hasRef) {
    html += "<div>" + esc(c.refLabel) + " " +
      esc(num(p.ref) ? fmtNum(p.ref, c.def.digits) + " " + c.def.unit : "—") + "</div>";
  }
  // Beats since the previous snapshot, so a beat between two dailies is still announced once.
  const from = i > 0 ? c.pts[i - 1].day : p.day - 1;
  const hits = c.beats.filter(function (b) { return b.day > from && b.day <= p.day; });
  if (hits.length) {
    html += '<div class="beat">' + esc(hits.map(function (b) { return b.dp_id; }).join(" · ")) +
      " opens</div>";
  }
  tip.innerHTML = html;
  tip.style.left = tip.style.right = "";
  if (xf > 0.5) tip.style.right = "calc(" + ((1 - xf) * 100).toFixed(3) + "% + 10px)";
  else tip.style.left = "calc(" + (xf * 100).toFixed(3) + "% + 10px)";
  tip.style.top = "4px";
  tip.style.display = "block";
}
function hideHover(plot) {
  const hair = plot.querySelector(".xhair"), tip = plot.querySelector(".ctip");
  if (hair) hair.style.display = "";
  if (tip) tip.style.display = "";
  S.hover = null;
}

/* ---------- moments: the reel's rows and the toasts' payload ---------------
   A pure function of the derivation it is handed. Emission (which of these has been ANNOUNCED)
   is separate transient state — see pumpToasts. */
function moments(D) {
  const out = [];
  D.decisions.forEach(function (d) {
    if (!d.resolved) return;
    const bits = [];
    if (d.outcome) bits.push("outcome " + d.outcome);
    if (num(d.latency)) bits.push("+" + d.latency + "d after the window opened");
    bits.push(d.tripwire ? "mechanical tripwire recorded in the ledger"
                         : "ledger entry recorded; the judge grades post-run");
    out.push({ key: "dp:" + d.dp_id, day: num(d.resolvedDay) ? d.resolvedDay : d.opens,
               kind: d.tripwire ? "trip" : "dp", tag: d.tripwire ? "TRIP" : "DP",
               title: (d.tripwire ? "🚨 Tripwire — " : "⚖ Decision resolved — ") + d.dp_id,
               text: bits.join(" · ") });
  });
  let pn = null, pm = null;
  for (const s of D.snaps) {
    if (!num(s.day)) continue;
    const n = worst(s.houses || [], "ammonia_ppm");
    // Edge-triggered: one moment when a breach STARTS, not one per day it persists.
    if (num(n) && n > NH3_CEILING && !(num(pn) && pn > NH3_CEILING)) {
      out.push({ key: "nh3:" + s.day, day: s.day, kind: "state", tag: "state",
                 title: "⚠ Ammonia over the ceiling",
                 text: "worst house " + fmtNum(n, 1) + " ppm, over the " + NH3_CEILING +
                       " ppm display ceiling" });
    }
    if (num(n)) pn = n;
    const m = (s.totals && num(s.totals.mortality_rate_weekly)) ? s.totals.mortality_rate_weekly : null;
    // A spike is a doubling, not a level: the floor only keeps noise at tiny rates out.
    if (num(m) && m >= MORT_WARN && num(pm) && pm > 0 && m >= pm * 2) {
      out.push({ key: "mort:" + s.day, day: s.day, kind: "state", tag: "state",
                 title: "⚠ Mortality spike",
                 text: "7-day rate " + fmtRatePct(m) + ", double the previous snapshot (" +
                       fmtRatePct(pm) + ")" });
    }
    if (num(m)) pm = m;
  }
  out.sort(function (a, b) { return (a.day - b.day) || a.key.localeCompare(b.key); });
  return out;
}

/* The tip derivation, cached by buffer length. */
function tipView() {
  if (S.tipLen !== S.events.length) {
    S.tipLen = S.events.length;
    S.tipD = derive(tip());
    S.moments = moments(S.tipD);
  }
  return S.tipD;
}

/* Called only when the buffer has grown — a toast announces news, and the backlog a feed opens
   with is not news. */
function pumpToasts() {
  tipView();
  const now = Date.now();
  if (!S.primed) {
    for (const m of S.moments) S.seen.add(m.key);
    S.primed = true;
  } else {
    for (const m of S.moments) {
      if (S.seen.has(m.key)) continue;
      S.seen.add(m.key);
      S.toasts.push({ m: m, until: now + TOAST_MS });
      // The ambience cues hang off the same anti-repeat set as the toasts, so a scrub can no more
      // re-ring a chime than it can re-announce a toast, and an opening backlog is silent.
      ambCue(m.kind);
    }
    if (S.toasts.length > TOAST_MAX) S.toasts = S.toasts.slice(-TOAST_MAX);
  }
  S.toasts = S.toasts.filter(function (t) { return t.until > now; });
}

function paintToasts() {
  // The stack sits just under the view tabs — over the hero, never over the KPI strip, whose
  // height changes with the viewport (so it is measured rather than guessed).
  const tabs = $("viewtabs").getBoundingClientRect();
  $("toasts").style.top = Math.max(16, tabs.bottom + 12).toFixed(0) + "px";
  // A toast's content is fixed at creation, so the same keys mean the same DOM: rewriting it would
  // replay the entry animation and re-announce the live region on every poll. Reposition only.
  const sig = S.toasts.map(function (t) { return t.m.key; }).join("|");
  if (sig === S.toastSig) return;
  S.toastSig = sig;
  $("toasts").innerHTML = S.toasts.map(function (t) {
    return '<div class="toast ' + t.m.kind + '" data-day="' + esc(t.m.day) +
      '" data-key="' + esc(t.m.key) + '" role="status">' +
      '<button class="tx" type="button" data-dismiss="' + esc(t.m.key) + '" title="dismiss">✕</button>' +
      '<div class="tt">' + esc(t.m.title) + "</div>" +
      '<div class="tb">' + esc(t.m.text) + "</div>" +
      '<div class="ta">jump to day ' + esc(t.m.day) + " →</div></div>";
  }).join("");
}

function paintReel(D) {
  tipView();

  // The row the cursor is standing on (or just past) — the reel's "you are here". Read off the
  // MOMENTS only: an annotation is not a beat of the run, so it never claims "you are here".
  let curKey = null;
  for (const m of S.moments) if (at !== null && m.day <= at) curKey = m.key;
  // The reel is the run's table of contents: machine moments AND the reader's own flags (spec §5.2
  // — "every toast appends to the reel"; §5.4 — flags land here too), in one day order.
  const merged = S.moments.concat(markRows());
  merged.sort(function (a, b) { return (a.day - b.day) || a.key.localeCompare(b.key); });
  const rows = merged.slice(-REEL_ROWS_MAX);

  // poll would drop keyboard focus out of a tabbed-to row about once a second on a live feed. The
  // annotation version is part of the signature: a new flag, an edited note or a removal all change
  // what a row says, and without it the rows would silently stay stale.
  const sig = merged.length + "@" + rows.map(function (m) { return m.key; }).join("|") +
    "#" + S.marksVer;

  // surviving row must still be annotatable.
  for (const m of rows) {
    if (m.markKey) continue;      // the reader's own rows already have their annotation
    // A moment has no transcript message, so its own key (`dp:<id>`, `nh3:<day>`, …) is the anchor
    // the export carries — the same rule the mail rows follow with their email id.
    offerMark("moment:" + m.key, "moment", m.day, m.key, m.title + " — " + m.text);
  }
  if (sig !== S.reelSig) {
    S.reelSig = sig;
    $("reel").innerHTML = rows.map(function (m) {
      const own = !!m.markKey;                       // a row the reader created, not a machine moment
      const key = own ? m.markKey : "moment:" + m.key;
      const marked = !!S.marks[key];
      return '<div class="reelrow' + (marked ? " marked" : "") + '" data-day="' + esc(m.day) +
        '" data-key="' + esc(m.key) + '" role="button" tabindex="0">' +
        '<span class="d">d' + esc(m.day) + "</span>" +
        '<span class="k ' + m.kind + '">' + esc(m.tag) + "</span>" +
        // The toast's leading glyph is dropped here — the row's own pill already carries the kind.
        // Only a non-word run is stripped, so a title that never had one keeps its first word.
        '<span class="x">' + esc(m.title.replace(/^[^\w]+\s/, "") + " — " + m.text) + "</span>" +
        flagHtml(key, marked, "rl") + '<span class="j">jump →</span></div>';
    }).join("") || '<div class="empty">no moments yet — decisions, ceiling breaches and mortality ' +
      "spikes land here as the run goes, and so do your own ⚑ flags</div>";
    const bits = [];
    if (S.moments.length) bits.push(S.moments.length + " moment" + (S.moments.length === 1 ? "" : "s"));
    if (marks) bits.push(marks + " annotation" + (marks === 1 ? "" : "s"));
    if (S.storeErr) bits.push("⚠ this browser refused to store them");
    $("reelmeta").textContent = bits.length ? bits.join(" · ") + " · a row jumps the dashboard"
      : "the run's table of contents — ⚑ any row to annotate it";
    const exp = $("expbtn");
    exp.disabled = !marks;
    exp.title = marks ? "download " + marks + " annotation" + (marks === 1 ? "" : "s") +
      " as annotations.csv" : "flag a row (⚑) to start an annotation set";
  }
  // "You are here" moves with the cursor, which the row set does not: toggle the class on the
  // surviving nodes rather than rebuilding them.
  for (const el of $("reel").querySelectorAll(".reelrow")) {
    el.classList.toggle("cur", el.dataset.key === curKey);
  }
}

/* ---------- run health (spec §5.3) --------------------------------------- */

function paintHealth(D) {
  const T = tipView();

  const hs = T.healths;
  const cell = function (k, v, tone) {

      (tone || "") + '">' + esc(v) + "</span></span>";
  };
  if (!hs.length) {
    strip.className = "healthstrip";

  // zero-rate intervals, and counting them would drag the median to 0 and disable both alarms
  // below. Invariant: a stalled run must never read healthy — hence the explicit zero branch too.
  const base = median(rates.filter(function (r) { return r > 0; }));
  const ended = T.ended || !S.live;
  let state, tone;
  if (ended) { state = "● replay"; tone = ""; }
  else if (num(last.blank_streak) && last.blank_streak >= 3) { state = "● stalling"; tone = "bad"; }
  else if (num(nowRate) && nowRate === 0) { state = "● stalling"; tone = "bad"; }
  else if (num(nowRate) && num(base) && base > 0 && nowRate < base * 0.25) { state = "● stalling"; tone = "bad"; }
  else if (num(nowRate) && num(base) && base > 0 && nowRate < base * 0.6) { state = "● slow"; tone = "warn"; }
  else { state = "● healthy"; tone = "ok"; }
  strip.className = "healthstrip" + (tone === "bad" ? " bad" : tone === "warn" ? " warn" : "");

  // A mockllm replay finishes in milliseconds, which makes the recorded rate enormous but true;
  // compact it rather than printing eight digits.
  const rateTxt = num(nowRate)
    ? (nowRate >= 1e4 ? fmtCount(nowRate) : fmtNum(nowRate, nowRate < 10 ? 1 : 0)) + " days/hr"
    : "—";
  let html = cell("state", state, tone);
  html += cell("day rate", rateTxt + (num(nowRate) && (tone === "bad" || tone === "warn") ? " ↓" : ""),
    tone === "ok" ? "" : tone);
  if (rates.length) {
    const shown = rates.slice(-RATE_BARS);
    const top = Math.max.apply(null, shown);
    html += '<span class="bars">' + shown.map(function (r, i) {
      return '<i class="' + (i === shown.length - 1 ? "now" : "") + '" style="height:' +
        clamp(top > 0 ? (r / top) * 100 : 2, 3, 100).toFixed(0) + '%"></i>';
    }).join("") + "</span>";
  }
  const perDay = num(last.turns) && num(T.day) && num(T.meta && T.meta.first_day) &&
    T.day > T.meta.first_day ? last.turns / (T.day - T.meta.first_day) : null;
  html += cell("turns", fmtCount(last.turns) + (num(perDay) ? " · " + fmtNum(perDay, 1) + "/day" : ""));
  if (num(last.blank_streak) && last.blank_streak > 0) {
    html += cell("blank turns", last.blank_streak + " in a row", last.blank_streak >= 3 ? "bad" : "warn");
  }
  html += cell("tokens", fmtCount(last.tokens_in) + " in · " + fmtCount(last.tokens_out) + " out");
  html += cell("retries", fmtCount(last.retries), num(last.retries) && last.retries >= 10 ? "bad"
    : num(last.retries) && last.retries >= 3 ? "warn" : "");
  const lastDay = T.meta && num(T.meta.last_day) ? T.meta.last_day : null;
  if (lastDay !== null) {
    const left = num(T.day) ? lastDay - T.day : null;
    const eta = ended ? "—"
      : (num(left) && left <= 0) ? "at final day"
      : (num(left) && num(nowRate) && nowRate > 0) ? fmtEta(left / nowRate) : "—";
    html += cell("eta day " + lastDay, eta + (tone === "bad" && eta !== "—" ? " ⚠" : ""), tone);
  }

  strip.innerHTML = html;
}

/* ---------- the note editor (spec §5.4) ----------------------------------- */

/* ---------- snapshot export (spec §5.5) ----------------------------------
   `foreignObject` serialization, no external library and no CDN (spec §5.5 forbids one). The
   approved degrade path is a ladder: capture as the page is → capture with the webfont families
   swapped for the system stacks the page already falls back to offline → tell the reader and offer
   the print stylesheet. Nothing here can fail silently; the last rung always reports. */

  const target = D.meta && D.meta.target ? String(D.meta.target) : "";
  const model = target.replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+/, "").replace(/-+$/, "")
    .slice(0, 40) || "unknown";

  const now = new Date();
  const two = function (v) { return (v < 10 ? "0" : "") + v; };

  // to the capture wrapper as well — otherwise every var() in the clone would resolve to nothing.
  css = css.replace(/:root\s*\{/, ":root, .snaproot {");

  // capture falls back to the system stacks the page already uses offline.

}

  const a = src.querySelectorAll(SNAP_SCROLLERS), b = clone.querySelectorAll(SNAP_SCROLLERS);
  for (let i = 0; i < a.length && i < b.length; i++) {

    // first child up by the scroll offset takes every sibling with it.

  const clone = node.cloneNode(true);
  syncScroll(node, clone);

    "; color:" + (b.color || "#c8cedb") + "; font-size:" + b.fontSize +
    "; font-family:" + (systemFonts ? stripFonts(b.fontFamily) : b.fontFamily) + ";");

  if (snapMsgTimer !== null) window.clearTimeout(snapMsgTimer);
  snapMsgTimer = null;
  // The print fallback carries an action, so it stays until the next attempt; a success line goes.

  // have it re-announced once a second (the same guard the toasts and the reel carry).

async function snapshot() {
