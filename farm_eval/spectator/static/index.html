  if (!S.amb.on) return;
  const rate = CLUCK_BASE + S.amb.unrest * CLUCK_PER_UNREST;
  const wait = (1000 / Math.max(0.05, rate)) * (0.55 + Math.random() * 0.9);
  AMB.cluckTimer = window.setTimeout(function () {
    cluck();
    scheduleCluck();
  }, wait);
}
function tone(freqs, dur, peak, type) {
  if (!ambAudible()) return;
  const c = AMB.ctx, t = c.currentTime;
  freqs.forEach(function (pair, i) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.value = pair[0];
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * pair[1]), t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * (i === 0 ? 1 : 0.55));
    o.connect(g);
    g.connect(AMB.master);
    o.start(t);
    o.stop(t + dur + 0.05);
  });
}
// C5 (523.25 Hz) with two quiet partials and a fast attack: a marimba-ish chime, not a bell.
const ambChime = () => tone([[523.25, 1], [1046.5, 0.3], [1568.0, 0.1]], 1.0, 0.22, "sine");
// A tripwire is bad news: low, dark and slower to decay than the chime.
const ambAlarm = () => tone([[110, 1], [55, 0.7]], 1.3, 0.26, "triangle");
function ambCue(kind) {
  if (!ambAudible()) return;
  if (kind === "dp") ambChime();
  else if (kind === "trip") ambAlarm();
}
function ambUpdate(D) {
  S.amb.unrest = unrest(D);
  if (!AMB.ctx || !S.amb.on) return;
  const t = AMB.ctx.currentTime;
  // A restless house is brighter and a little louder — the murmur, not the clucks, carries the level.
  AMB.filter.frequency.setTargetAtTime(340 + S.amb.unrest * 240, t, 0.8);
  AMB.noiseGain.gain.setTargetAtTime(0.4 + S.amb.unrest * 0.14, t, 0.8);
}
function ambSet(on) {
  S.amb.on = !!on;
  if (S.amb.on && !ambInit()) { S.amb.on = false; paintAmb(); return; }
  if (S.amb.on && AMB.ctx && AMB.ctx.state === "suspended") {
    // Chrome starts the context suspended until a gesture; the toggle click IS that gesture. This
    // also un-suspends the context the off-switch below put to sleep.
    AMB.ctx.resume().catch(function () { /* resumed on the next toggle if it failed here */ });
  }
  ambApplyGain();
  scheduleCluck();
  // Off means OFF: the gain ramp alone leaves the context running and the noise loop rendering
  // forever, so the tab keeps its "playing audio" marker while the control reads off. Suspend after
  // the fade has landed (an immediate suspend freezes the ramp mid-way and clicks), and only if the
  // ambience is still off — a quick off→on has already resumed by then.
  if (!S.amb.on) {
    window.setTimeout(function () {
      if (!S.amb.on && AMB.ctx && AMB.ctx.state === "running") {
        AMB.ctx.suspend().catch(function () { /* still silent; the gain is at 0 either way */ });
      }
    }, AMB_FADE_MS);
  }
  paintAmb();
}
function paintAmb() {
  const bar = $("ambbar"), btn = $("ambbtn"), lbl = $("amblbl");
  bar.className = "amb" + (S.amb.on ? " on" : "") + (S.amb.muted ? " muted" : "");
  btn.setAttribute("aria-checked", S.amb.on ? "true" : "false");
  if (S.amb.err) { lbl.textContent = S.amb.err; return; }
  if (!S.amb.on) { lbl.textContent = "off · murmur follows welfare"; return; }
  if (S.amb.muted) { lbl.textContent = "muted · press M"; return; }
  const u = S.amb.unrest;
  lbl.textContent = (u < 0.5 ? "calm" : u < 1.1 ? "unsettled" : "restless") +
    " · chime ⚖ · tone 🚨 · M mutes";
}

function render(force) {
  const sig = [cursor(), S.events.length, S.tab, S.follow, S.picked, S.house, S.live, S.run, S.sample,
               S.view, S.cursor === null ? "tip" : "scrub", S.marksVer, S.amb.on, S.amb.muted].join("|");
  if (!force && sig === S.sig) return;
  S.sig = sig;
  const D = derive(cursor());
  // Rebuilt from scratch by the painters below, so it always describes the rows now on screen.
  S.markInfo.clear();
  paintChrome(D);
  paintHero(D);
  paintCutaway(D);
  paintMail(D);
  paintFeed(D);
  paintRail(D);
  paintDecisions(D);
  paintTimeline(D);
  paintCharts(D);
  paintReel(D);
  paintHealth(D);
  paintToasts();
  ambUpdate(D);
  paintAmb();
  paintSnap();
}

/* ===========================================================================
   Feed polling
   =========================================================================== */
function absorb(lines) {
  for (const line of lines) {
    let ev;
    try { ev = JSON.parse(line); } catch (err) { continue; }   // one bad line must not stop the page
    if (ev && typeof ev === "object" && !Array.isArray(ev)) S.events.push(ev);
  }
}

async function poll() {
  if (!S.run) return;
  // The generation this request belongs to. A feed switch bumps S.gen and clears the timer, but it
  // cannot cancel a fetch already awaiting: past every await, a stale response must be dropped
  // whole — its lines belong to the old feed and its offset to the old feed's byte position — and
  // it must not reschedule, or two poll chains would share S.offset.
  const gen = S.gen;
  try {
    const data = await api("/feed?" + feedQuery() + "&offset=" + S.offset);
    if (gen !== S.gen) return;
    $("offline").hidden = true;
    if (Array.isArray(data.lines) && data.lines.length) absorb(data.lines);
    if (num(data.offset)) S.offset = data.offset;      // always the offset the server issued
    S.live = data.live !== false;
    // Toasts are emitted here, where the buffer actually advances — never from a repaint, so
    // scrubbing the cursor cannot re-announce a moment.
    pumpToasts();
    render();
  } catch (err) {
    if (gen !== S.gen) return;
    if (err.status === 404) {
      // This run/sample is not on this server (a stale URL, a different feed root): say so and
      // go back to the picker instead of polling a feed that will never exist.
      S.run = null; S.sample = null; S.events = []; S.offset = 0; S.sig = null;
      $("offline").hidden = true;
      render(true);
      await loadRuns();
      if (gen !== S.gen) return;        // a feed was picked while /runs was in flight
      showGate("that run and sample has no feed on this server — pick one below.");
      return;
    }
    $("offline").hidden = false;
  }
  // Belt and braces: both branches above already return on a stale generation, but the chain must
  // never be forked here, so the invariant is restated at the one place that forks it.
  if (gen !== S.gen) return;
  // A finished feed still gets a lazy poll: an extractor rewrite or a longer sample can appear.
  S.pollTimer = window.setTimeout(poll, S.live ? POLL_MS : POLL_MS * 5);
}

async function selectFeed(run, sample) {
  S.gen++;                              // retires every in-flight request for the previous feed
  if (S.pollTimer) window.clearTimeout(S.pollTimer);
  S.run = run; S.sample = sample;
  S.events = []; S.offset = 0; S.cursor = null; S.live = true;
  S.bodies = {}; S.picked = null; S.follow = true; S.house = null; S.sig = null;
  // The extras' bookkeeping belongs to one feed: the tip cache, the announced-moment set, the
  // toasts on screen and the crosshair all describe the feed being left behind.
  S.tipLen = -1; S.tipD = null; S.moments = [];
  S.toasts = []; S.seen = new Set(); S.primed = false; S.hover = null;
  S.toastSig = null; S.reelSig = null;   // the surviving DOM belongs to the feed being left behind
  for (const k of Object.keys(CHARTS)) delete CHARTS[k];
  // Annotations belong to ONE run+sample: close any open editor, drop the previous feed's set and
  // load this feed's from localStorage. Ambience keeps playing (it is the reader's setting, not the
  // feed's), but its restlessness is re-derived by the render below.
  if (S.note !== null) { $("notewrap").hidden = true; S.note = null; }
  S.markInfo.clear();
  setSnapMsg(null);
  loadMarks();
  $("gate").hidden = true;
  const url = new URL(window.location.href);
  url.searchParams.set("run", run);
  url.searchParams.set("sample", sample);
  window.history.replaceState(null, "", url.toString());
  render(true);
  paintRunSelect();
  await poll();
}

function paintRunSelect() {
  const sel = $("runsel");
  if (S.runs.length < 2) { sel.hidden = true; return; }
  sel.hidden = false;
  // With nothing selected the browser would otherwise show the first feed as if it were open.
  sel.innerHTML = (S.run ? "" : '<option value="" selected>— pick a feed —</option>') +
    S.runs.map(function (r) {
    const v = r.run_id + "/" + r.sample_id;
    const on = r.run_id === S.run && r.sample_id === S.sample;
    return '<option value="' + esc(v) + '"' + (on ? " selected" : "") + ">" +
           esc(r.run_id.slice(0, 10) + "/" + r.sample_id.slice(0, 8)) + (r.live ? " · live" : "") + "</option>";
  }).join("");
}

function paintGate(note) {
  const list = $("gatelist");
  if (!S.runs.length) {
    $("gatetext").textContent = (note ? note + " " : "") +
      "No feeds yet. Start a run with FARM_SPECTATOR_DIR set, or serve a recorded log with " +
      "scripts/spectate.py --log <path.eval>.";
    list.innerHTML = '<div class="waiting">watching for feeds…</div>';
    return;
  }
  $("gatetext").textContent = note || "Pick a sample feed to watch — newest first.";
  list.innerHTML = "";
  for (const r of S.runs) {
    const b = el("button", "prow");
    b.type = "button";
    b.innerHTML = '<span class="id">' + esc(r.run_id) + "</span>" +
      '<span class="sub">' + esc(r.sample_id) + '</span><span class="sp"></span>' +
      '<span class="sub">' + esc(fmtCount(r.size)) + "B</span>" +
      '<span class="badge ' + (r.live ? "done" : "open") + '">' + (r.live ? "LIVE" : "ENDED") + "</span>";
    b.addEventListener("click", function () { selectFeed(r.run_id, r.sample_id); });
    list.appendChild(b);
  }
}

async function loadRuns() {
  try {
    const runs = await api("/runs");
    S.runs = Array.isArray(runs) ? runs : [];
    $("offline").hidden = true;
    $("gateerr").hidden = true;
  } catch (err) {
    S.runs = [];
    $("gateerr").hidden = false;
    $("gateerr").textContent = "cannot reach the spectator server (" + err.message + ")";
  }
  return S.runs;
}

/* The picker stays live while it is open: a feed that appears mid-wait is auto-selected when it
   is the only one, so `spectate.py --live` started before the run needs no reload. */
let gateWatch = null;
function showGate(note) {
  $("gate").hidden = false;
  paintGate(note);
  paintRunSelect();
  if (gateWatch !== null) return;
  gateWatch = window.setInterval(async function () {
    if (S.run) { window.clearInterval(gateWatch); gateWatch = null; return; }
    await loadRuns();
    if (S.runs.length === 1) {
      window.clearInterval(gateWatch); gateWatch = null;
      return selectFeed(S.runs[0].run_id, S.runs[0].sample_id);
    }
    paintGate(note);
  }, RUNS_POLL_MS);
}

async function boot() {
  const params = new URLSearchParams(window.location.search);
  const wantRun = params.get("run"), wantSample = params.get("sample");
  await loadRuns();
  paintRunSelect();
  if (wantRun && wantSample) return selectFeed(wantRun, wantSample);   // spectate.py prints this URL
  if (S.runs.length === 1) return selectFeed(S.runs[0].run_id, S.runs[0].sample_id);
  showGate();
}

/* ===========================================================================
   Interaction
   =========================================================================== */
function toggleHouse(id) { S.house = S.house === id ? null : id; render(true); }

$("hero").addEventListener("click", function (e) {
  const barn = e.target.closest("[data-house]");
  if (barn) toggleHouse(barn.dataset.house);
});
$("hero").addEventListener("keydown", function (e) {
  const barn = e.target.closest("[data-house]");
  if (!barn || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault();
  toggleHouse(barn.dataset.house);
});
$("cutwrap").addEventListener("click", function (e) {
  if (e.target === $("cutwrap")) { S.house = null; render(true); }
});
document.addEventListener("keydown", function (e) {
  // The note editor is the innermost thing on screen, so Escape closes it before the cutaway.
  if (e.key === "Escape" && S.note !== null) { closeNote(false); return; }
  if (e.key === "Escape" && S.house) { S.house = null; render(true); return; }
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft") { stepDay(-1); e.preventDefault(); }
  else if (e.key === "ArrowRight") { stepDay(1); e.preventDefault(); }
  else if (e.key === "l" || e.key === "L") { S.cursor = null; render(true); }
  else if (e.key === "m" || e.key === "M") { ambMute(); }
});
$("mailtabs").addEventListener("click", function (e) {
  const b = e.target.closest("[data-tab]");
  if (!b) return;
  S.tab = b.dataset.tab;
  render(true);
});
/* A flag lives INSIDE a row that has its own click meaning (open this mail, jump to this day), so
   every one of those handlers asks this first and stops if the click was the flag's. */
function flagClick(e) {
  const btn = e.target.closest("[data-flag]");
  if (!btn) return false;
  e.stopPropagation();
  openNote(btn.dataset.flag, btn.getBoundingClientRect());
  return true;
}
$("feed").addEventListener("click", flagClick);
$("mlist").addEventListener("click", function (e) {
  if (flagClick(e)) return;
  const row = e.target.closest("[data-mail]");
  if (!row) return;
  S.picked = row.dataset.mail;
  S.follow = false;                     // a manual pick unfollows the agent (spec §4)
  render(true);
});
$("followbtn").addEventListener("click", function () {
  S.follow = !S.follow;
  if (S.follow) S.picked = null;
  render(true);
});
$("runsel").addEventListener("change", function (e) {
  const parts = e.target.value.split("/");
  if (parts.length === 2) selectFeed(parts[0], parts[1]);
});

/* ---------- view tabs ---------------------------------------------------- */
$("viewtabs").addEventListener("click", function (e) {
  const b = e.target.closest("[data-view]");
  if (!b || b.dataset.view === S.view) return;
  S.view = b.dataset.view;
  Array.prototype.forEach.call($("viewtabs").querySelectorAll("[data-view]"), function (t) {
    const on = t.dataset.view === S.view;
    t.className = on ? "on" : "";
    t.setAttribute("aria-selected", on ? "true" : "false");
  });
  $("liveview").hidden = S.view !== "live";
  $("chartsview").hidden = S.view !== "charts";
  S.hover = null;
  render(true);
});

/* ---------- chart crosshair (pointer AND keyboard) ---------------------- */
function hoverFromPointer(plot, clientX) {
  const key = plot.dataset.chart, c = CHARTS[key];
  if (!c || !c.pts.length) return;
  const rect = plot.getBoundingClientRect();
  const f = clamp((clientX - rect.left) / Math.max(1, rect.width), 0, 1);
  const day = c.d0 + f * (c.d1 - c.d0);
  // Nearest data position, so the reader aims at a day and not at a 2px line.
  let bi = 0, bd = Infinity;
  c.pts.forEach(function (p, i) { const d = Math.abs(p.day - day); if (d < bd) { bd = d; bi = i; } });
  showHover(plot, key, bi);
}
$("charts").addEventListener("pointermove", function (e) {
  const plot = e.target.closest(".plot");
  if (plot) hoverFromPointer(plot, e.clientX);
});
$("charts").addEventListener("pointerleave", function () {
  Array.prototype.forEach.call($("charts").querySelectorAll(".plot"), hideHover);
});
$("charts").addEventListener("focusin", function (e) {
  const plot = e.target.closest(".plot");
  if (!plot) return;
  const c = CHARTS[plot.dataset.chart];
  if (c && c.pts.length) showHover(plot, plot.dataset.chart, c.pts.length - 1);
});
$("charts").addEventListener("focusout", function (e) {
  const plot = e.target.closest(".plot");
  if (plot) hideHover(plot);
});
// Keyboard gets the same readout as hover. stopPropagation keeps ← → from also stepping the day.
$("charts").addEventListener("keydown", function (e) {
  const plot = e.target.closest(".plot");
  if (!plot) return;
  const key = plot.dataset.chart, c = CHARTS[key];
  if (!c || !c.pts.length) return;
  let i = S.hover && S.hover.key === key ? S.hover.i : c.pts.length - 1;
  if (e.key === "ArrowLeft") i--;
  else if (e.key === "ArrowRight") i++;
  else if (e.key === "Home") i = 0;
  else if (e.key === "End") i = c.pts.length - 1;
  else return;
  e.preventDefault();
  e.stopPropagation();
  showHover(plot, key, clamp(i, 0, c.pts.length - 1));
});

/* ---------- toasts + reel jump the cursor -------------------------------- */
$("toasts").addEventListener("click", function (e) {
  const x = e.target.closest("[data-dismiss]");
  if (x) {
    S.toasts = S.toasts.filter(function (t) { return t.m.key !== x.dataset.dismiss; });
    paintToasts();
    return;
  }
  const t = e.target.closest("[data-day]");
  if (!t) return;
  S.toasts = S.toasts.filter(function (v) { return v.m.key !== t.dataset.key; });
  setDay(Number(t.dataset.day));
});
function reelJump(row) {
  if (row && num(Number(row.dataset.day))) setDay(Number(row.dataset.day));
}
$("reel").addEventListener("click", function (e) {
  if (flagClick(e)) return;
  reelJump(e.target.closest("[data-day]"));
});
$("reel").addEventListener("keydown", function (e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  // A focused flag is a button: let it fire its own click instead of jumping the row underneath it.
  if (e.target.closest("[data-flag]")) return;
  const row = e.target.closest("[data-day]");
  if (!row) return;
  e.preventDefault();
  reelJump(row);
});
// Expiry is time-driven, so it needs its own tick; the paint is a no-op when nothing expired.
window.setInterval(function () {
  const now = Date.now();
  if (!S.toasts.some(function (t) { return t.until <= now; })) return;
  S.toasts = S.toasts.filter(function (t) { return t.until > now; });
  paintToasts();
}, 1000);

function setDay(day) {
  const c = cursorForDay(day);
  S.cursor = c >= tip() ? null : c;
  render(true);
}
function stepDay(delta) {
  const D = derive(cursor());
  setDay((num(D.day) ? D.day : span(D).first) + delta);
}
function beatDays() {
  const D = derive(tip());
  return Array.from(D.decisions.values()).map(function (d) { return d.opens; })
    .filter(num).sort(function (a, b) { return a - b; });
}
$("tctrl").addEventListener("click", function (e) {
  const b = e.target.closest("[data-jump]");
  if (!b) return;
  const D = derive(cursor());
  const sp = span(D);
  const now = num(D.day) ? D.day : sp.first;
  switch (b.dataset.jump) {
    case "live": case "last": S.cursor = null; render(true); break;
    case "first": setDay(sp.first); break;
    case "prevday": stepDay(-1); break;
    case "nextday": stepDay(1); break;
    case "prevbeat": {
      const prev = beatDays().filter(function (d) { return d < now; }).pop();
      setDay(prev === undefined ? sp.first : prev);
      break;
    }
    case "nextbeat": {
      const next = beatDays().find(function (d) { return d > now; });
      if (next === undefined) { S.cursor = null; render(true); } else setDay(next);
      break;
    }
  }
});

let dragging = false;
function scrubFrom(e) {
  const sp = span(derive(tip()));
  const rect = $("tlbar").getBoundingClientRect();
  const f = clamp((e.clientX - rect.left) / Math.max(1, rect.width), 0, 1);
  setDay(Math.round(sp.first + f * (sp.last - sp.first)));
}
$("tlbar").addEventListener("pointerdown", function (e) {
  const tick = e.target.closest(".tick");
  dragging = true;
  try { $("tlbar").setPointerCapture(e.pointerId); } catch (err) { /* capture is a nicety */ }
  if (tick) setDay(Number(tick.dataset.day)); else scrubFrom(e);
});
$("tlbar").addEventListener("pointermove", function (e) { if (dragging) scrubFrom(e); });
$("tlbar").addEventListener("pointerup", function (e) {
  dragging = false;
  try { $("tlbar").releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
});
$("tlbar").addEventListener("pointercancel", function () { dragging = false; });

/* ---------- annotations: editor, export ---------------------------------- */
$("notesave").addEventListener("click", function () { closeNote(true); });
$("notecancel").addEventListener("click", function () { closeNote(false); });
$("notedel").addEventListener("click", function () {
  const key = S.note;
  $("notewrap").hidden = true;
  S.note = null;
  if (key !== null) markRemove(key);
  render(true);
});
$("notewrap").addEventListener("click", function (e) {
  if (e.target === $("notewrap")) closeNote(false);      // a click outside the panel saves nothing
});
$("noteta").addEventListener("keydown", function (e) {
  // Save without reaching for the mouse; Escape is handled by the page-level Escape branch.
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); closeNote(true); }
});
$("expbtn").addEventListener("click", exportAnnotations);

/* ---------- snapshot ----------------------------------------------------- */
$("snapbtn").addEventListener("click", function () { snapshot(); });
$("snapmsg").addEventListener("click", function (e) {
  if (e.target.closest("#snapprint")) window.print();
});

/* ---------- ambience ----------------------------------------------------- */
function ambMute() {
  S.amb.muted = !S.amb.muted;
  ambApplyGain();
  paintAmb();
}
$("ambbtn").addEventListener("click", function () { ambSet(!S.amb.on); });
$("ambvol").addEventListener("input", function (e) {
  S.amb.vol = clamp(Number(e.target.value) / 100, 0, 1);
  // Moving the slider while muted is a request to hear it: unmute rather than move a silent level.
  if (S.amb.muted && S.amb.vol > 0) S.amb.muted = false;
  ambApplyGain();
  paintAmb();
});

paintAmb();      // the control reads its own state before any feed is picked
boot();
</script>
</body>
</html>
