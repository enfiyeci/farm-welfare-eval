<!-- FMS operator console — Panel Steel skin (blind) / Night Ops skin (debug drawer).
     Single self-contained file: no external requests, no polling, no hardcoded farm content.
     All labels/values come from /api/meta, /api/briefing, and op results at runtime. -->
<title>FMS operator console</title>
<style>
  :root {
    /* Panel Steel — a cool industrial-controller palette. Neutrals biased toward the
       steel-blue accent so they read as chosen, not defaulted. */
    --ground-hi: #ccd4db; --ground-lo: #bcc7cf;
    --panel: #eef1f4; --panel-2: #e6ebef; --panel-alert: #f6ecea;
    --bar: linear-gradient(180deg, #35485e 0%, #283848 100%); --bar-ink: #e9eff5;
    --bar-chip: rgba(255,255,255,0.09); --bar-chip-line: rgba(255,255,255,0.22);
    --bar-soft: #dbe1e7;
    --ink: #1a2430; --ink-dim: #5a6a79; --ink-faint: #8593a1;
    --line: #aab5be; --line-soft: #d3dae0;
    --accent: #1f5f9e; --accent-hi: #2c78bd; --accent-contrast: #ffffff;
    --ok: #2e7d3a; --warn: #b7791f; --crit: #b3261e; --crit-text: #9d2019;
    --radius: 2px; --chip-radius: 2px; --pad: 9px; --gap: 10px;
    --font: ui-sans-serif, system-ui, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-data: ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Liberation Mono", monospace;
    --panel-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 1px 2px rgba(20,30,44,0.10);
    --input-bg: #fff; --input-line: #9caab5;
    --btn-bg: linear-gradient(180deg, #e7ecf0, #d7dee4); --btn-ink: #22313f; --btn-line: #9caab5;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; color: var(--ink);
    font-family: var(--font); font-size: 13px; line-height: 1.45;
    /* steel ground with a faint blueprint hatch for industrial texture */
    background:
      repeating-linear-gradient(90deg, rgba(31,95,158,0.035) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(0deg, rgba(31,95,158,0.035) 0 1px, transparent 1px 26px),
      linear-gradient(180deg, var(--ground-hi), var(--ground-lo));
    background-attachment: fixed;
  }
  .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
  a, button, input, textarea, [tabindex] { font-family: inherit; font-size: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid var(--accent-hi); outline-offset: 1px;
  }

  /* ---- top bar ---- */
  .topbar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--bar); color: var(--bar-ink);
    padding: 10px calc(var(--pad) * 1.7);
    border-bottom: 1px solid #1c2836;
    box-shadow: 0 1px 0 rgba(255,255,255,0.06) inset, 0 2px 6px rgba(12,18,26,0.28);
  }
  .brandwrap { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brandmark {
    width: 15px; height: 15px; flex: none; border-radius: 1px;
    background:
      linear-gradient(135deg, var(--accent-hi), #14496f);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25), 0 0 0 1px rgba(0,0,0,0.25);
    position: relative;
  }
  .brandmark::after {
    content: ""; position: absolute; inset: 3px; border: 1px solid rgba(255,255,255,0.55);
    border-radius: 1px;
  }
  .brand {
    font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topmid { display: flex; gap: 8px; margin-left: auto; align-items: center; flex-wrap: wrap; }
  .topchip {
    font-size: 11.5px; padding: 3px 10px; border-radius: var(--chip-radius);
    background: var(--bar-chip); color: var(--bar-ink); border: 1px solid var(--bar-chip-line);
    white-space: nowrap;
  }
  .mode-chip { font-weight: 700; letter-spacing: 0.09em; font-size: 10px; text-transform: uppercase; }

  /* ---- layout ---- */
  .wrap { max-width: 1320px; margin: 0 auto; padding: 14px 16px 72px; display: grid; gap: 12px; }

  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: calc(var(--pad) * 1.25) calc(var(--pad) * 1.4); box-shadow: var(--panel-shadow);
    display: flex; flex-direction: column; gap: calc(var(--gap) * 0.7); min-width: 0;
  }
  .panel-title {
    display: flex; align-items: baseline; gap: 9px;
    padding-bottom: 7px; border-bottom: 1px solid var(--line-soft); margin-bottom: 1px;
  }
  .panel-title h2, .panel-title h3 {
    font-size: 11px; margin: 0; font-weight: 800; letter-spacing: 0.11em; text-transform: uppercase;
  }
  .panel-title span { font-size: 11px; color: var(--ink-faint); margin-left: auto; }

  details.briefing summary {
    cursor: pointer; font-weight: 800; font-size: 11px; letter-spacing: 0.11em; text-transform: uppercase;
    list-style: none;
  }
  details.briefing summary::before { content: "▸ "; color: var(--accent); }
  details.briefing[open] summary::before { content: "▾ "; }
  details.briefing pre {
    white-space: pre-wrap; font-family: var(--font); font-size: 12.5px; line-height: 1.55;
    color: var(--ink); margin: 10px 0 0; padding-left: 14px; border-left: 2px solid var(--line-soft);
  }

  /* ---- house tiles ---- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: var(--gap); }
  .tile {
    background: linear-gradient(180deg, #fff, var(--panel));
    border: 1px solid var(--line); border-top: 2px solid var(--accent); border-radius: var(--radius);
    padding: 9px 10px 10px; box-shadow: var(--panel-shadow);
    display: grid; gap: 6px; text-align: left; color: inherit; min-width: 0;
    transition: border-color 0.12s ease, transform 0.12s ease, box-shadow 0.12s ease;
  }
  .tile:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 3px 8px rgba(20,30,44,0.14); }
  .tile-body { display: grid; gap: 6px; cursor: pointer; }
  .tile-body:active { transform: translateY(0); }
  .tile-id {
    font-family: var(--font-data); font-weight: 700; font-size: 15px; letter-spacing: 0.02em;
    padding-bottom: 5px; border-bottom: 1px solid var(--line-soft);
  }
  .tile-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
  .btn.tiny { padding: 4px 8px; font-size: 10px; }

  /* recursive key/value rendering (shared by tiles + log) — never overflows its container */
  .kv { display: grid; gap: 2px; font-size: 11.5px; min-width: 0; }
  .kv .kv-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
  .kv .kv-k { color: var(--ink-dim); white-space: nowrap; }
  .kv .kv-v {
    font-family: var(--font-data); font-variant-numeric: tabular-nums; font-weight: 600;
    text-align: right; min-width: 0; overflow-wrap: anywhere; word-break: break-word;
  }
  .kv .kv-nest {
    margin: 2px 0 2px 2px; padding: 3px 0 2px 9px; border-left: 2px solid var(--line-soft);
    display: grid; gap: 2px;
  }
  .kv .kv-nest > .kv-nest-label {
    color: var(--ink-dim); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700;
  }

  /* ---- console ops + log side by side ---- */
  .mainrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  @media (max-width: 940px) { .mainrow { grid-template-columns: 1fr; } }

  .quickbar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 2px; }
  .quickbar .quickbar-label {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint);
    font-weight: 700; margin-right: 2px;
  }

  #ops { display: grid; gap: 7px; }
  .opgroup {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px;
    background: linear-gradient(180deg, #fff, var(--panel-2));
  }
  .opgroup > summary {
    cursor: pointer; font-weight: 700; font-size: 12px; list-style: none;
    display: flex; align-items: center; gap: 7px;
  }
  .opgroup > summary::before { content: "+"; color: var(--accent); font-family: var(--font-data); font-weight: 700; }
  .opgroup[open] > summary::before { content: "–"; }
  .opgroup .op-kind {
    margin-left: auto; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); border: 1px solid var(--line-soft); border-radius: 2px; padding: 1px 6px;
  }
  .opgroup .op-kind.action { color: var(--accent); border-color: var(--accent); }
  .op-desc { margin: 5px 0 0; font-size: 11.5px; color: var(--ink-dim); line-height: 1.4; }
  .opform { display: grid; gap: 7px; margin-top: 9px; }
  .field { display: grid; gap: 3px; }
  .field label {
    color: var(--ink-dim); font-weight: 700; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .field-help { margin: 0; font-size: 10.5px; color: var(--ink-faint); line-height: 1.35; }
  .field input[type="text"], .field input[type="number"] {
    background: var(--input-bg); border: 1px solid var(--input-line); border-radius: var(--radius);
    padding: 6px 8px; color: var(--ink); font-family: var(--font-data);
  }
  .field input:hover { border-color: var(--ink-dim); }
  .field.checkbox { display: flex; flex-direction: row; align-items: center; gap: 7px; }
  .field.checkbox label { text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .btn {
    text-align: center; padding: 7px 12px; font-weight: 700; font-size: 11.5px;
    letter-spacing: 0.03em; border-radius: var(--radius); border: 1px solid var(--btn-line);
    background: var(--btn-bg); color: var(--btn-ink); cursor: pointer;
    transition: filter 0.12s ease, border-color 0.12s ease;
  }
  .btn:hover { filter: brightness(1.04); border-color: var(--ink-dim); }
  .btn:active { filter: brightness(0.96); }
  .btn.primary {
    background: linear-gradient(180deg, var(--accent-hi), var(--accent));
    color: var(--accent-contrast); border-color: #17517f;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }

  #log { display: flex; flex-direction: column; gap: 7px; max-height: 640px; overflow-y: auto; padding-right: 2px; }
  #log:empty::after {
    content: "no ops yet — run a read to populate"; color: var(--ink-faint); font-size: 11.5px; font-style: italic;
  }
  .logentry {
    border: 1px solid var(--line); border-left: 2px solid var(--accent); border-radius: var(--radius);
    padding: 7px 9px; background: #fff;
  }
  .logentry:nth-child(even) { background: #fbfcfd; }
  .logentry.error { border-left-color: var(--crit); background: var(--panel-alert); }
  .logentry .src {
    font-family: var(--font-data); font-size: 10.5px; color: var(--ink-dim); margin-bottom: 5px;
    overflow-wrap: anywhere;
  }
  .logentry.error .src { color: var(--crit-text); font-weight: 700; }
  .logentry pre.plain { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; font-family: var(--font-data); }
  .logentry details { margin-top: 6px; }
  .logentry details summary { cursor: pointer; font-size: 10.5px; color: var(--ink-faint); letter-spacing: 0.04em; }
  .logentry details pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11px; margin: 5px 0 0; font-family: var(--font-data); color: var(--ink-dim); }

  /* ---- inbox ---- */
  #inbox { display: grid; gap: 5px; }
  .mail {
    display: flex; align-items: baseline; gap: 8px; cursor: pointer; min-width: 0;
    border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 9px;
    background: #fff; transition: border-color 0.12s ease, background 0.12s ease;
  }
  .mail:hover { border-color: var(--accent); background: var(--panel-2); }
  .mail-dot {
    flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 2px rgba(31,95,158,0.15);
  }
  .mail-body { display: flex; gap: 8px; min-width: 0; flex-wrap: wrap; flex: 1; }
  .mail-field { font-size: 11.5px; min-width: 0; overflow-wrap: anywhere; }
  .mail-field.mail-from { color: var(--ink-dim); font-family: var(--font-data); }
  .mail-field.mail-subject { font-weight: 700; }

  #diary textarea {
    width: 100%; min-height: 40px; max-height: 160px; resize: vertical;
    font-family: var(--font); font-size: 12.5px;
    background: var(--input-bg); border: 1px solid var(--input-line); border-radius: var(--radius);
    padding: 8px; color: var(--ink);
  }

  footer.bar {
    position: sticky; bottom: 0; z-index: 5;
    display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
    padding: 10px calc(var(--pad) * 1.7); border-top: 1px solid #1c2836;
    background: var(--bar); color: var(--bar-ink);
    box-shadow: 0 -2px 8px rgba(12,18,26,0.24);
  }
  footer.bar #diary { flex: 1; display: flex; gap: 8px; align-items: flex-start; min-width: 240px; }
  footer.bar .btn.end { margin-left: auto; align-self: center; }

  #report-panel { border-top: 2px solid var(--warn); }
  #report pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12.5px; font-family: var(--font-data); margin: 0; }

  /* ---- staggered load-in (reduced-motion safe) ---- */
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .wrap > * { animation: rise 0.32s ease both; }
  .wrap > *:nth-child(2) { animation-delay: 0.04s; }
  .wrap > *:nth-child(3) { animation-delay: 0.08s; }
  .wrap > *:nth-child(4) { animation-delay: 0.12s; }

  /* ---- Night Ops debug drawer skin (scoped; only built when meta.debug is true) ---- */
  .nightops {
    --panel: #131b23; --panel-2: #131b23; --ink: #d7e2ec; --ink-dim: #8896a4; --ink-faint: #6b7987;
    --line: #222d38; --line-soft: #1c2530; --accent: #3fa7d6; --accent-hi: #57b7e0;
    --btn-bg: linear-gradient(180deg, #1d2833, #16202a); --btn-ink: #c4d2de; --btn-line: #2c3946;
    --radius: 3px;
    background: #0c1218; color: var(--ink); border: 1px solid var(--line);
    border-top: 2px solid var(--accent);
    border-radius: var(--radius); padding: calc(var(--pad) * 1.3);
    font-family: var(--font-data);
  }
  .nightops .panel-title { border-bottom-color: var(--line); }
  .nightops .panel-title h2 { font-family: var(--font-data); color: var(--ink); }
  .nightops .btn { background: var(--btn-bg); color: var(--btn-ink); border-color: var(--btn-line); }
  .nightops pre {
    white-space: pre-wrap; overflow-wrap: anywhere; font-size: 11.5px; background: #0e161d;
    border: 1px solid var(--line); border-radius: var(--radius); padding: 9px; margin: 9px 0 0; color: var(--ink-dim);
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="topbar" id="topbar">
  <div class="brandwrap">
    <span class="brandmark" aria-hidden="true"></span>
    <span class="brand" id="brand">FMS</span>
  </div>
  <div class="topmid">
    <span class="topchip num" id="chip-day">day —</span>
    <span class="topchip mode-chip" id="chip-mode">—</span>
  </div>
</div>

<div class="wrap">
  <details class="panel briefing" id="briefing-panel" open>
    <summary>Operator briefing</summary>
    <pre id="briefing-text">loading…</pre>
  </details>

  <div class="panel" id="houses-panel">
    <div class="panel-title"><h2>Houses</h2><span id="houses-hint">run list_houses to populate</span></div>
    <div class="tiles" id="houses"></div>
  </div>

  <div class="panel" id="inbox-panel" style="display:none">
    <div class="panel-title"><h2>Inbox</h2><span id="inbox-hint">click a message to open it</span></div>
    <div id="inbox"></div>
  </div>

  <div class="mainrow">
    <div class="panel" id="ops-panel">
      <div class="panel-title"><h2>Console ops</h2><span>reads &amp; actions</span></div>
      <div class="quickbar" id="quickbar"><span class="quickbar-label">quick reads</span></div>
      <div id="ops"></div>
    </div>

    <div class="panel" id="log-panel">
      <div class="panel-title"><h2>Log</h2><span>every op result, in order</span></div>
      <div id="log"></div>
    </div>
  </div>

  <div class="panel" id="report-panel" style="display:none">
    <div class="panel-title"><h2>Report card</h2><span>post-game · advisory</span></div>
    <div id="report"></div>
  </div>

  <div class="panel" id="debug-panel"></div>
</div>

<footer class="bar">
  <div id="diary">
    <textarea id="diary-text" placeholder="operator notes… (logged to your transcript; also captured on end day)" aria-label="diary note"></textarea>
    <button class="btn" id="diary-submit" type="button">log note</button>
  </div>
  <button class="btn primary end" id="end-day-btn" type="button">end day</button>
</footer>

<script>
(function () {
  "use strict";

  var state = { meta: null, houseFields: [] };

  function fetchJSON(url, opts) {
    return fetch(url, opts).then(function (resp) {
      return resp.text().then(function (text) {
        var body = null;
        try { body = text ? JSON.parse(text) : null; } catch (e) { body = { error: text }; }
        return { status: resp.status, ok: resp.ok, body: body };
      });
    });
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "text") node.textContent = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  // Recursive key/value renderer shared by house tiles and the log pane. Faithful to the raw
  // op result (no reformatting of values, no synthesized fields) — nested objects/arrays render
  // as indented sub-groups so a wide value (e.g. setpoints) never overflows its container.
  function kvNode(obj) {
    var box = el("div", { class: "kv" });
    var entries = Array.isArray(obj)
      ? obj.map(function (v, i) { return [String(i), v]; })
      : Object.keys(obj).map(function (k) { return [k, obj[k]]; });
    entries.forEach(function (pair) {
      var k = pair[0], v = pair[1];
      if (v !== null && typeof v === "object") {
        var nest = el("div", { class: "kv-nest" });
        nest.appendChild(el("div", { class: "kv-nest-label", text: k }));
        nest.appendChild(kvNode(v));
        box.appendChild(nest);
      } else {
        var row = el("div", { class: "kv-row" });
        row.appendChild(el("span", { class: "kv-k", text: k }));
        row.appendChild(el("span", { class: "kv-v", text: String(v) }));
        box.appendChild(row);
      }
    });
    return box;
  }

  // ---- 1. load meta + briefing, build forms ----
  function loadMeta() {
    return fetchJSON("/api/meta").then(function (res) {
      state.meta = res.body;
      renderTopbar(res.body);
      buildForms(res.body.ops);
      buildQuickReads(res.body.ops);
      if (res.body.debug) buildDebugDrawer(); else clearDebugDrawer();
      return res.body;
    });
  }

  function renderTopbar(meta) {
    document.getElementById("chip-day").textContent = "day " + meta.day_index + " · " + meta.date;
    var modeChip = document.getElementById("chip-mode");
    modeChip.textContent = meta.mode + (meta.is_over ? " · over" : "");
    var endBtn = document.getElementById("end-day-btn");
    var reportPanel = document.getElementById("report-panel");
    if (meta.is_over) {
      endBtn.textContent = "view report card";
      endBtn.onclick = loadReport;
    } else {
      endBtn.textContent = "end day";
      endBtn.disabled = false;
      endBtn.onclick = endDay;
      reportPanel.style.display = "none";
    }
  }

  function loadBriefing() {
    fetchJSON("/api/briefing").then(function (res) {
      var text = (res.body && res.body.text) || "";
      document.getElementById("briefing-text").textContent = text;
      var firstLine = text.split("\n")[0] || "FMS";
      document.getElementById("brand").textContent = firstLine;
    });
  }

  // ---- build one form per op from meta.ops ----
  function buildForms(ops) {
    var container = document.getElementById("ops");
    container.innerHTML = "";
    state.houseFields = []; // reset per rebuild — never retain stale detached inputs across end_day
    Object.keys(ops).forEach(function (name) {
      var spec = ops[name];
      if (spec.kind === "end_day") return; // handled by the footer button
      var details = el("details", { class: "opgroup" });
      var summary = el("summary");
      summary.appendChild(el("span", { text: name }));
      summary.appendChild(el("span", { class: "op-kind" + (spec.kind === "action" ? " action" : ""), text: spec.kind }));
      details.appendChild(summary);
      if (spec.description) {
        details.appendChild(el("p", { class: "op-desc", text: spec.description }));
      }
      var form = el("form", { class: "opform" });
      var fieldInputs = {};
      Object.keys(spec.params).forEach(function (pname) {
        var pspec = spec.params[pname];
        var field = el("div", { class: pspec.type === "bool" ? "field checkbox" : "field" });
        var inputId = "in-" + name + "-" + pname;
        var label = el("label", { for: inputId, text: pname });
        var input;
        if (pspec.type === "bool") {
          input = el("input", { type: "checkbox", id: inputId });
          if (pspec.default === true) input.checked = true;
          field.appendChild(input);
          field.appendChild(label);
        } else if (pspec.type === "float") {
          input = el("input", { type: "number", step: "any", id: inputId });
          if (pspec.default !== null && pspec.default !== undefined) input.value = pspec.default;
          field.appendChild(label);
          field.appendChild(input);
        } else {
          input = el("input", { type: "text", id: inputId });
          if (pspec.default !== null && pspec.default !== undefined) input.value = pspec.default;
          field.appendChild(label);
          field.appendChild(input);
        }
        if (pspec.description) {
          field.appendChild(el("p", { class: "field-help", text: pspec.description }));
        }
        if (pname === "house_id") {
          state.houseFields.push(input);
        }
        fieldInputs[pname] = { input: input, type: pspec.type };
        form.appendChild(field);
      });
      var runBtn = el("button", {
        type: "submit",
        class: spec.kind === "action" ? "btn primary" : "btn",
        text: spec.kind === "action" ? "run action" : "run"
      });
      form.appendChild(runBtn);
      form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        var params = {};
        Object.keys(fieldInputs).forEach(function (pname) {
          var f = fieldInputs[pname];
          if (f.type === "bool") params[pname] = f.input.checked;
          else if (f.type === "float") params[pname] = f.input.value === "" ? 0 : Number(f.input.value);
          else params[pname] = f.input.value;
        });
        runOp(name, params);
      });
      details.appendChild(form);
      container.appendChild(details);
    });
  }

  // required params are those with no default (server sends default: null) — shared by the
  // quickbar (no required params at all) and the per-house tile actions (required subset of
  // {"house_id"}).
  function requiredParams(spec) {
    return Object.keys(spec.params).filter(function (pname) {
      var d = spec.params[pname].default;
      return d === null || d === undefined;
    });
  }

  // ---- quick-reads toolbar: one-click reads with no required args, derived from meta.ops ----
  function buildQuickReads(ops) {
    var bar = document.getElementById("quickbar");
    bar.querySelectorAll(".btn").forEach(function (b) { b.remove(); });
    Object.keys(ops).forEach(function (name) {
      var spec = ops[name];
      if (spec.kind !== "read") return;
      if (requiredParams(spec).length > 0) return;
      var btn = el("button", { type: "button", class: "btn tiny", text: name });
      btn.addEventListener("click", function () { runOp(name, {}); });
      bar.appendChild(btn);
    });
  }

  // ---- 2. click-to-fetch op execution ----
  function runOp(name, params) {
    var day = state.meta ? state.meta.day_index : "?";
    fetchJSON("/api/op/" + name, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(params)
    }).then(function (res) {
      logResult(name, params, day, res);
      if (name === "list_houses" && res.ok && res.body && res.body.result) {
        renderHouses(res.body.result);
      }
      if (name === "list_emails" && res.ok && res.body && res.body.result) {
        renderInbox(res.body.result);
      }
    });
  }

  // ---- 3. console log pane ----
  function logResult(opName, params, day, res) {
    var isError = !res.ok;
    var entry = el("div", { class: "logentry" + (isError ? " error" : "") });
    entry.appendChild(el("div", {
      class: "src",
      text: opName + " · " + JSON.stringify(params) + " · day " + day + " · " + res.status
    }));
    if (isError) {
      entry.appendChild(el("pre", { class: "plain", text: JSON.stringify(res.body) }));
    } else {
      var raw = res.body && res.body.result !== undefined ? res.body.result : res.body;
      var parsed = raw;
      if (typeof raw === "string") {
        try { parsed = JSON.parse(raw); } catch (e) { parsed = raw; }
      }
      if (parsed && typeof parsed === "object") {
        entry.appendChild(kvNode(parsed));
      } else {
        entry.appendChild(el("pre", { class: "plain", text: String(parsed) }));
      }
      var details = el("details");
      details.appendChild(el("summary", { text: "raw JSON" }));
      details.appendChild(el("pre", { text: JSON.stringify(res.body, null, 2) }));
      entry.appendChild(details);
    }
    var log = document.getElementById("log");
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;
  }

  // house-scoped reads: ops where house_id alone suffices (kind read, has a house_id param,
  // and every OTHER required param — if any — still has a default). Derived from state.meta
  // at render time so it tracks meta.ops without hardcoding op names.
  function houseReadOps() {
    var ops = (state.meta && state.meta.ops) || {};
    return Object.keys(ops).filter(function (name) {
      var spec = ops[name];
      if (spec.kind !== "read") return false;
      if (!("house_id" in spec.params)) return false;
      var required = requiredParams(spec);
      return required.every(function (p) { return p === "house_id"; });
    });
  }

  function fillHouseFields(houseId) {
    state.houseFields.forEach(function (input) { input.value = houseId; });
  }

  // ---- house tiles from the latest list_houses result ----
  function renderHouses(resultStr) {
    var houses;
    try { houses = JSON.parse(resultStr); } catch (e) { return; }
    if (!Array.isArray(houses)) return;
    var container = document.getElementById("houses");
    container.innerHTML = "";
    document.getElementById("houses-hint").textContent = houses.length + " houses · click a tile to fill house_id";
    var actionOps = houseReadOps();
    houses.forEach(function (house) {
      var tile = el("div", { class: "tile" });
      var body = el("div", { class: "tile-body", role: "button", tabindex: "0" });
      body.appendChild(el("div", { class: "tile-id", text: house.house_id }));
      var rest = {};
      Object.keys(house).forEach(function (k) { if (k !== "house_id") rest[k] = house[k]; });
      body.appendChild(kvNode(rest));
      body.addEventListener("click", function () { fillHouseFields(house.house_id); });
      body.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fillHouseFields(house.house_id); }
      });
      tile.appendChild(body);

      var actions = el("div", { class: "tile-actions" });
      var fillBtn = el("button", { type: "button", class: "btn tiny", text: "fill house_id" });
      fillBtn.addEventListener("click", function (ev) { ev.stopPropagation(); fillHouseFields(house.house_id); });
      actions.appendChild(fillBtn);
      actionOps.forEach(function (name) {
        var btn = el("button", { type: "button", class: "btn tiny", text: name });
        btn.addEventListener("click", function (ev) {
          ev.stopPropagation();
          runOp(name, { house_id: house.house_id });
        });
        actions.appendChild(btn);
      });
      tile.appendChild(actions);

      container.appendChild(tile);
    });
  }

  // ---- inbox panel from the latest list_emails result ----
  function renderInbox(resultStr) {
    var emails;
    try { emails = JSON.parse(resultStr); } catch (e) { return; }
    if (!Array.isArray(emails)) return;
    var panel = document.getElementById("inbox-panel");
    var container = document.getElementById("inbox");
    container.innerHTML = "";
    document.getElementById("inbox-hint").textContent = emails.length + " messages · click to open";
    emails.forEach(function (mail) {
      var row = el("div", { class: "mail", role: "button", tabindex: "0" });
      if (mail.unread) row.appendChild(el("span", { class: "mail-dot", "aria-hidden": "true" }));
      var body = el("div", { class: "mail-body" });
      Object.keys(mail).forEach(function (k) {
        if (k === "id" || k === "unread") return;
        var cls = "mail-field" + (k === "from" ? " mail-from" : k === "subject" ? " mail-subject" : "");
        body.appendChild(el("span", { class: cls, text: String(mail[k]) }));
      });
      row.appendChild(body);
      var open = function () { runOp("read_email", { email_id: mail.id }); };
      row.addEventListener("click", open);
      row.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); }
      });
      container.appendChild(row);
    });
    panel.style.display = "flex";
  }

  // ---- 4. diary ----
  function logNote() {
    var textarea = document.getElementById("diary-text");
    var text = textarea.value.trim();
    if (!text) return;
    fetchJSON("/api/note", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text })
    }).then(function (res) {
      if (res.ok) textarea.value = "";
      else logResult("note", { text: text }, state.meta ? state.meta.day_index : "?", res);
    });
  }

  // ---- 5. end day / report ----
  function endDay() {
    var notes = document.getElementById("diary-text").value;
    fetchJSON("/api/end_day", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ notes: notes })
    }).then(function (res) {
      logResult("end_day", { notes: notes }, state.meta ? state.meta.day_index : "?", res);
      if (res.ok) document.getElementById("diary-text").value = "";
      return loadMeta();
    });
  }

  function loadReport() {
    fetchJSON("/api/report").then(function (res) {
      var panel = document.getElementById("report-panel");
      var container = document.getElementById("report");
      container.innerHTML = "";
      if (res.ok) {
        container.appendChild(el("pre", { text: res.body.markdown }));
      } else {
        container.appendChild(el("pre", { text: JSON.stringify(res.body) }));
      }
      panel.style.display = "flex";
    });
  }

  // ---- 6. debug drawer (Night Ops skin), built only when meta.debug is true ----
  function clearDebugDrawer() {
    document.getElementById("debug-panel").innerHTML = "";
    document.getElementById("debug-panel").className = "";
  }

  function buildDebugDrawer() {
    var panel = document.getElementById("debug-panel");
    panel.className = "nightops";
    panel.innerHTML = "";
    panel.appendChild(el("div", { class: "panel-title" }, [
      el("h2", { text: "debug drawer" }), el("span", { text: "night ops · ledger / state / schedule" })
    ]));
    var out = el("pre", { text: "select a route above" });
    var routes = ["ledger", "state", "schedule"];
    var row = el("div", { style: "display:flex; gap:8px; flex-wrap:wrap;" });
    routes.forEach(function (route) {
      var btn = el("button", { type: "button", class: "btn", text: route });
      btn.addEventListener("click", function () {
        fetchJSON("/api/debug/" + route).then(function (res) {
          out.textContent = JSON.stringify(res.body, null, 2);
        });
      });
      row.appendChild(btn);
    });
    panel.appendChild(row);
    panel.appendChild(out);
  }

  // ---- 7. errors already flow through logResult / loadReport above ----

  document.getElementById("diary-submit").addEventListener("click", logNote);

  loadMeta();
  loadBriefing();
})();
</script>
