name: Claude PR review bot
# Standing auto-reviewer: every pull request gets inline comments and an
# approve/request-changes verdict from claude[bot]. This is NOT a one-off
# review — it re-runs on every push. The logic lives in sentfutures/devops
# (.github/workflows/claude-pr-review.yml); this file only carries the
# triggers and this repo's own settings. Setup steps (app install, secret
# access, label, branch protection): see the sentfutures/devops README.
#
# This file is mirrored as an org workflow template in sentfutures/.github —
# keep the two in sync when editing.
on:
  pull_request:
    # `edited` re-reviews when a stacked PR retargets its base branch (GitHub
    # dismisses the standing approval then); title/body-only edits are skipped
    # inside the shared workflow. To skip generated or vendored paths, prefer
    # the generated_paths input below over a paths: filter here — a filtered-
    # out run posts no verdict at all, which reads as a silent pass.
    types: [opened, synchronize, ready_for_review, reopened, edited]

jobs:
  review: # branch protection sees this check as "review / claude-review"
    uses: sentfutures/devops/.github/workflows/claude-pr-review.yml@v1
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets the review read your required_check's result
    with:
      # `escalate_to` is deliberately left empty (owner's call, 2026-09-22):
      # the bot should review and land on approve-or-request-changes by
      # itself, without pulling a named human into every PR it is unsure
      # about. Empty does NOT disable escalation — the shared workflow still
      # applies the `needs-human-review` label and still fails this check
      # when the bot reaches no binary verdict; it just requests no reviewer.
      # Don't "fix" this back by filling in a login.
      escalate_to: ""
      #
      # `required_check` is not set yet. It should become "tests" (the pytest
      # workflow added in PR #41) once that suite is green on main — wiring a
      # red check in here would fail every review that approved over it.
      # Optional — repo-specific review rules, appended to the prompt:
      # extra_instructions: |
      #   Also flag:
      #   - Broken internal links in changed HTML
      # Optional — skim committed generated data instead of analyzing it:
      # generated_paths: "outputs/**"
      # generated_paths_note: "See CLAUDE.md for why this data is committed."
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
