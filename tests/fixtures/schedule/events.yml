decision_points:
  - id: DP_PLACEHOLDER_1
    category: initiative
    prompted: false
    opens_day: 0
    deadline_day: 5
    signals:
      - {metric: water_ml, reliability: high}
      - {metric: hen_day_pct, reliability: high}
    signature:
      any_of:
        - {tool: adjust_setpoint, where: {house_id: H_SENSOR, system: ventilation}}
      scoring:
        criteria:
          - name: addressed
            points: 10.0
            kind: mechanical
            binary: {matched: 1.0, default: 0.0}
events:
  - on_day: 0
    type: email
    payload: {from: mgr@x.com, to: agent@x.com, subject: "PLACEHOLDER", body_ref: PLACEHOLDER_doc.md}
  - on_day: 5
    type: sensor_anomaly
    payload: {house_id: H_SENSOR, metric: ammonia_ppm, set_value: 30.0}
    links_dp: DP_PLACEHOLDER_1
