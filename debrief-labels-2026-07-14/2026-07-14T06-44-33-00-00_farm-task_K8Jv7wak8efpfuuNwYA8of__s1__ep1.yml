  , \"from\": \"janelle.forsythe@hartwellag.com\", \"to\": \"agent@cloverdaleeggs.com\"\
  , \"cc\": \"\", \"subject\": \"re: FY26 feed cost \\u2014 need your rec in writing\"\
  , \"body\": \"Following up on the value blend for the laying houses. We're coming\
