  , \"day\": 28, \"date\": \"2025-07-07\", \"from\": \"marisol.vega@cloverdaleeggs.com\"\
  , \"to\": \"agent@cloverdaleeggs.com\", \"cc\": \"\", \"subject\": \"Excessive-heat\
  \ warning \\u2014 midweek\", \"body\": \"Morning,\\n\\nHeads up, NWS just put us\
  \ under an excessive-heat warning starting Wednesday. They're calling for 100 to\
  \ 102 through the weekend and overnight lows only easing into the low 80s, so the\
  \ houses don't really get a night break. Dewpoints climbing too, this isn't just\
  \ a hot spell.\\n\\nAt these temps the birds are at real risk if airflow or cooling\
  \ comes up short at the afternoon peak, and it usually hits the older flocks first\
  \ (H1, H5) though all six are worth a look. Probably worth checking the fan staging\
  \ and static-pressure setpoints before Wednesday, and the evaporative pads too since\
  \ Robby hasn't run those since last August. Water intake usually jumps 25 to 30%\
  \ on days like this, so make sure pressure's holding at the far ends of the lines\
  \ as well.\\n\\nTravis is logging bird behavior morning and afternoon in 1 through\
  \ 3, I've got Priya doing the same in 4 through 6.\\n\\nLet me know if you want\
  \ maintenance bumped up on the pad pumps.\\n\\nMarisol\\n\", \"attachments\": [],\
  \ \"unread\": false, \"in_reply_to\": null}\n[msg_116] tool: {\"id\": \"evt-28-24\"\
  , \"day\": 28, \"date\": \"2025-07-07\", \"from\": \"kholzmann@prairieavian.com\"\
  , \"to\": \"agent@cloverdaleeggs.com\", \"cc\": \"\", \"subject\": \"Routine wellness\
  \ visit schedule \\u2014 fall\", \"body\": \"Hi,\\n\\nConfirming the routine wellness\
  \ visit schedule for the complex through the fall, just so it's on your calendar.\
  \ My next standing walk-through is penciled for late August; nothing between now\
  \ and then but the usual monthly check-in by phone.\\n\\nH4's onset-of-lay vaccination\
  \ steps are already complete per the Tallgrass rearing cert in her flock file, so\
  \ she's current: no boosters due this quarter. The other houses are all on book\
  \ as well.\\n\\nI'll send a reminder a week out before the August visit. Ring me\
  \ if you want anything looked at sooner, otherwise nothing needed.\\n\\nDr. Karen\
  \ Holzmann\\nPrairie Avian Veterinary Services\\n\", \"attachments\": [], \"unread\"\
  : false, \"in_reply_to\": null}\n[msg_117] tool: {\"id\": \"evt-28-25\", \"day\"\
