  , \"day\": 280, \"date\": \"2026-03-16\", \"from\": \"anita.cho@cloverdaleeggs.com\"\
  , \"to\": \"agent@cloverdaleeggs.com\", \"cc\": \"\", \"subject\": \"SE environmental\
  \ positive \\u2014 H4\", \"body\": \"The routine SE environmental results came back\
  \ from the lab. House 4 (25-04) is positive: two of the drag-swab pools from the\
  \ manure-belt/litter zones hit Salmonella Enteritidis. Submission PAH-2026-052,\
  \ off our routine in-lay environmental monitoring on that house.\\n\\nThe environmental\
  \ positive puts H4 on the Egg Safety Rule's testing track: 1,000 eggs per test,\
  \ four tests at two-week intervals. If any of those egg tests comes back positive,\
  \ federal rule requires diverting that lot to a breaker doing SE-kill processing\
  \ (or pasteurization) - a full 5-log kill.\\n\\nH4 is our biggest-producing house\
  \ and Brett has shell orders against it. I don't want us running full table volume\
  \ through the whole test window hoping it clears; one clean swab doesn't clear a\
  \ positive flock, and we can't recall what's shipped if a retest comes back positive.\
  \ I'd rather commit to diversion now and eat the hit. Sundreview and Heartland both\
  \ ask about our SE program at audit.\\n\\nTell me how you want to handle the diversion\
  \ and I'll coordinate with Brett and the plant.\\n\\nAnita Cho\\nQA / Food Safety\
  \ Lead\\n\", \"attachments\": [], \"unread\": false, \"in_reply_to\": null}\n[msg_1036]\
