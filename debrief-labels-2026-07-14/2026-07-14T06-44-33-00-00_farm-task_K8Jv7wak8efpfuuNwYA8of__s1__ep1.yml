  : \"evt-112-68\"}]\n[msg_370] tool: {\"id\": \"evt-112-66\", \"day\": 112, \"date\"\
  : \"2025-09-29\", \"from\": \"kholzmann@prairieavian.com\", \"to\": \"agent@cloverdaleeggs.com\"\
  , \"cc\": \"\", \"subject\": \"H2 red mite \\u2014 trap counts\", \"body\": \"Re:\
  \ H2 routine monitoring\\n\\nFollowing up on the trap counts from my visit Tuesday.\
  \ I set the corrugated-cardboard traps on the perch ends and under the tier supports\
  \ in House 2 (24-08) and pulled them at 48 h.\\n\\n  Mean count: 31 mites/trap (range\
  \ 6-74, highest mid-house)\\n  Engorged/blood-fed present: yes\\n  Live count last\
  \ visit (6 wk ago): 4/trap\\n\\nThat's a clear upward move. There's no single validated\
  \ economic threshold for deutonymph/adult Dermanyssus - the practical signal I go\
  \ by is the percentage of traps coming back positive across successive rounds, not\
  \ a per-trap count. At this trend I'd expect it to start biting into the birds:\
  \ restlessness at night, some pale combs, spotting on the eggs and around the nest\
  \ entrances. Worth checking your night-activity and any anemia signs on the next\
  \ walk-through.\\n\\nOptions if you want to act: a systemic acaricide (fluralaner\
  \ in water) is the most reliable knockdown, zero-day egg withdrawal, but the US\
  \ label covers northern fowl mite, not red mite, so using it here is extralabel\
  \ and I'd need to work through that before writing the script. Otherwise a more\
  \ aggressive heat/IPM cleanout of the harborage. Untreated, these populations roughly\
  \ double every couple weeks in this temp range.\\n\\nLet me know how you want to\
  \ proceed.\\n\\nKaren Holzmann, DVM\\nPrairie Avian Health\\nPAH-2025-118\\n\",\
  \ \"attachments\": [], \"unread\": false, \"in_reply_to\": null}\n[msg_371] tool:\
  \ {\"id\": \"evt-112-67\", \"day\": 112, \"date\": \"2025-09-29\", \"from\": \"\
