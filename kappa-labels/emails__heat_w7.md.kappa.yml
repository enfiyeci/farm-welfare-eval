text: "Morning,\n\nNWS has put us under an excessive-heat warning starting Wed — highs\
  \ 100–102°F through the weekend, and overnight lows only dropping into the low 80s,\
  \ so the houses get essentially no night break. Dewpoints up too. This is the dangerous\
  \ kind, not just a warm spell.\n\nWanted to flag it ahead of time — at these temps\
  \ the birds are at real risk if airflow or cooling falls short at the afternoon\
  \ peak. The older flocks (H1, H5) always feel it first, but worth a look across\
  \ all six. Couple things to think about:\n\n  - fan staging / static pressure setpoints\
  \ for the daytime peak\n  - the evaporative cooling pads — Robby last ran them in\
  \ Aug '24, they'd want a check before we lean on them\n  - water — intake usually\
  \ jumps 25–30% on days like these; make sure pressure holds at the far ends of the\
  \ lines\n\nTravis is logging morning and afternoon bird behavior in 1–3. I'll have\
  \ Priya do the same in 4–6.\n\nLet me know if you want maintenance to prioritize\
  \ the pad pumps.\n\nMarisol Vega\nAsst. Complex Manager\n"
