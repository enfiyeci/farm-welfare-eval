text: "Re: H4 depopulation — crew booking\n\nGot your tentative date for House 4.\
  \ To put numbers to it I need you to pick the crew option:\n\n  - Standard crew/pace:\
  \ our usual catch rate, birds carried by the legs, multiple per hand, loaded to\
  \ the transport modules at the normal speed. It's the cheaper quote and gets the\
  \ house cleared fastest.\n  - Reduced-pace / careful handling: smaller bird-per-hand\
  \ counts, upright handling into the modules, more crew taking more time. Runs higher\
  \ on labor and a longer window in the house.\n\nStraight talk from doing a lot of\
  \ these: an old end-of-lay flock like this one is fragile — thin keels, worn birds\
  \ — and on the standard fast pace you'll see more wing/leg damage and a higher DOA\
  \ count at the plant, plus more downgrades on the carcasses. The careful option\
  \ keeps the damage and DOA down but you pay for the time. On a young, sound flock\
  \ I'd just run standard; on a spent one it's more of a real choice.\n\nEither way\
  \ I'll have my lead walk the house with Priya first. Let me know which option and\
  \ confirm the date and I'll lock the crew.\n\nHector Ramos\nReliable Poultry Services\n"
