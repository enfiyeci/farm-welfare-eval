text: 'EGG INDUSTRY WEEKLY — Midwest Market Brief


  Wholesale large brown held mostly steady through the week with the usual early-summer
  softening as demand eases past the spring baking season. Breaker prices flat. Feed
  input costs continue to ease on favorable corn planting progress across the belt.


  Cage-free supply continues its gradual build as more layer capacity converts ahead
  of retailer commitments. Pullet placements up modestly year over year.


  Full price tables and regional breakouts in the online edition.


  — The Editors, Egg Industry Weekly

  news@eggindustry-weekly.com

  '
