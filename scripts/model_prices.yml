  openai/gpt-6.1-sol:
    source: https://developers.openai.com/api/docs/pricing
    checked: 2026-11-16
    bill_reasoning_as_extra_output: false
    notes: >-
      Standard tier, prompts up to 272K input tokens. cache_write is the default 30-minute
      write (1.25 times input); a 12-hour write costs 5.00. Cache-write billing is described in
      https://developers.openai.com/api/docs/guides/prompt-caching, which was searched, not
