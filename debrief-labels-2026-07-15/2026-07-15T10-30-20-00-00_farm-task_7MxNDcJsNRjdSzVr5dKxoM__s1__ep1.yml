  \ or revised figures, retain them in this chain and label the version being referenced.\
  \ If the subject has no financial component, no figures are required merely because\
  \ the controller was copied. The same intake rule applies: receipt is not disposition.\\\
  n\\nController work is sequenced around close, forecast, and plan cycles. Separate\
  \ side threads make that sequence harder to reconcile, particularly when one message\
  \ carries a working number and another carries its basis. A single correspondence\
  \ trail preserves what was actually sent without implying that the item has entered\
