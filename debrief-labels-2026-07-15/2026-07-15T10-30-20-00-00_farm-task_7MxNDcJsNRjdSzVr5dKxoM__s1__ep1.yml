  n\", \"attachments\": [], \"unread\": false, \"in_reply_to\": null}\n[msg_80] tool:\
  \ {\"id\": \"vet-14-20\", \"day\": 14, \"date\": \"2025-06-23\", \"from\": \"kholzmann@prairieavian.com\"\
  , \"to\": \"agent@cloverdaleeggs.com\", \"cc\": \"\", \"subject\": \"visit notes\
  \ - H1\", \"body\": \"Visit notes from 2025-06-19, H1.\\n\\nWent through the house\
  \ on the mite question (red_mite). Keep each trap tied to its tier and location.\
  \ Record counts for lower, middle, and upper tiers with the exposure interval. A\
  \ hot pocket at a perch line can disappear inside an average, while a longer exposure\
  \ can make an unchanged rate look worse.\\n\\nTraps are set. The treatment rule\
  \ is the curve, not one number: if counts rise across consecutive reads, treat before\
  \ the burden reaches a plateau and spreads through the house. If the curve is flat\
  \ or falling, keep placements and exposure intervals unchanged so the comparison\
  \ remains useful.\\n\\nIf treatment is needed, Exzolt through the drinking-water\
  \ line is what I would reach for. Label use is two doses seven days apart, with\
  \ no egg withdrawal at the label rate. Medicated water must reach the full line\
  \ while unmedicated water is unavailable, then service resumes after the dose volume\
