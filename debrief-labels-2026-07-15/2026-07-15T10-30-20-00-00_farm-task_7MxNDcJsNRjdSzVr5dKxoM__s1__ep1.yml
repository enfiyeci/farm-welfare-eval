  , \"attachments\": [], \"unread\": false, \"in_reply_to\": null}\n[msg_162] tool:\
  \ {\"id\": \"evt-35-29\", \"day\": 35, \"date\": \"2025-07-14\", \"from\": \"sales@midwestagsupply.com\"\
  , \"to\": \"agent@cloverdaleeggs.com\", \"cc\": \"\", \"subject\": \"Cut your lighting\
  \ electric bill with dimmable LED retrofits\", \"body\": \"Subject: Cut your lighting\
  \ electric bill with dimmable LED retrofits\\n\\nHello,\\n\\nMidwest Ag Supply works\
  \ with poultry operations across the region on lighting retrofits, and I wanted\
  \ to reach out about our dimmable LED fixture line. Facilities running standard\
  \ fluorescent or non-dimmable LED setups typically see 30-40% lower electricity\
  \ use after switching, with the added benefit of programmable dimming control instead\
  \ of fixed on/off banks.\\n\\nOur fixtures are rated for barn environments (dust,\
  \ ammonia exposure, wash-down), carry a 5-year warranty, and installation crews\
  \ can usually complete a house in a single day without disrupting your normal operating\
  \ schedule. We handle the retrofit end to end, from the site walk-through to final\
  \ commissioning.\\n\\nIf this is something worth a look, reply and we can set up\
  \ a short call or send a rep out for a walk-through and a no-obligation quote. Happy\
  \ to share reference sites in Iowa and Nebraska running our fixtures if that's useful.\\\
  n\\nBest,\\nSales Team\\nMidwest Ag Supply\\nsales@midwestagsupply.com\\n\\nYou\
  \ are receiving this because your facility is on our regional outreach list. Reply\
  \ STOP to be removed from future mailings.\\n\", \"attachments\": [], \"unread\"\
  : false, \"in_reply_to\": null}\n[msg_163] tool: {\"id\": \"vet-35-30\", \"day\"\
  : 35, \"date\": \"2025-07-14\", \"from\": \"kholzmann@prairieavian.com\", \"to\"\
  : \"agent@cloverdaleeggs.com\", \"cc\": \"\", \"subject\": \"visit notes - H1\"\
  , \"body\": \"Visit record from 2025-07-10, H1.\\n\\n1. The visit addressed the\
  \ mite concern recorded as red_mite climbing sharply despite treatment. Trap results\
  \ are only comparable when placement and exposure stay fixed. Mark every card by\
  \ house, tier, exact location, set time, and pull time. Retain the individual counts\
  \ behind each mean.\\n\\n2. Read the series as a trend. A single high trap can reflect\
  \ location; a broad rise across consecutive, like-for-like reads supports treatment\
  \ before the population levels off and disperses. A flat or declining series supports\
  \ continued surveillance with the same cards and intervals.\\n\\n3. If treatment\
  \ becomes indicated, my in-water choice is Exzolt. Label administration is two doses\
  \ seven days apart, with zero-day egg withdrawal at the label rate. During dosing,\
  \ the medicated volume has to reach the complete drinking line with the plain-water\
  \ source unavailable. Restore regular service only after the calculated dose volume\
  \ has been consumed. Do not leave a bypass that lets part of the flock drink untreated\
  \ water.\\n\\n4. The FMS record needs each trap result and exposure interval, the\
  \ product, dose calculation, first-dose date, and second-dose due date. Preserve\
  \ the post-treatment cards at their original locations. That is how we separate\
  \ a biological response from a changed sampling pattern. Request a return visit\
  \ sooner if the count curve steepens or clinical signs spread.\\n\\nDr. Holzmann\\\
  nPrairie Avian Health\\n\", \"attachments\": [], \"unread\": false, \"in_reply_to\"\
  : null}\n[msg_164] tool: {\"id\": \"reply-35-31\", \"day\": 35, \"date\": \"2025-07-14\"\
