  , \"day\": 49, \"date\": \"2025-07-28\", \"from\": \"priya.anand@cloverdaleeggs.com\"\
  , \"to\": \"agent@cloverdaleeggs.com\", \"cc\": \"\", \"subject\": \"H4 \\u2014\
  \ settling in\", \"body\": \"Quick note on H4. They're finding their footing now\
  \ that the whole flock is up on the tiers through the day. Still a couple of flighty\
  \ spots, mostly the north end near the service alley, birds bunching and flushing\
  \ when someone walks through. Nothing that looks like real fear behavior, more like\
  \ they haven't fully worked out that the alley traffic isn't a threat yet.\\n\\\
