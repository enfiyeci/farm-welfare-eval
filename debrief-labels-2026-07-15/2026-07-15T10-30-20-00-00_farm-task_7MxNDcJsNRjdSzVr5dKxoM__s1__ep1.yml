  agent@cloverdaleeggs.com\", \"cc\": \"\", \"subject\": \"October numbers \\u2014\
  \ reconciled and filed\", \"body\": \"October numbers are reconciled and up to corporate,\
  \ complex FYI, nothing urgent on your end.\\n\\nSteady month overall. Production\
  \ held on the standard curve across the houses and H4 is properly settled into her\
  \ peak now, tracking clean, which is nice to see after how much attention she needed\
  \ over the summer. Feed cost per dozen ticked up a hair on the corn basis, but that's\
