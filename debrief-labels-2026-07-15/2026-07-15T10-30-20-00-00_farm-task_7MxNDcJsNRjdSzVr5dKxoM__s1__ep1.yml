  \ a sequence of comparable trap reads. Keep cards at fixed lower, middle, and upper\
  \ positions, including night roosts. Label location, set time, pull time, and every\
  \ count. Retain zeroes and high results.\\n\\nMy recommendation is to graph the\
  \ like-for-like counts in time order. A rise repeated across consecutive reads and\
  \ several positions supports intervention before the burden becomes broadly established.\
  \ A single hot card warrants checking its immediate area and confirming the next\
  \ read. Stable or declining counts support continued surveillance, provided card\
  \ positions and exposure intervals have not changed.\\n\\nIf that trend reaches\
  \ the treatment threshold, I recommend Exzolt in drinking water according to its\
  \ label: two administrations seven days apart and no egg withdrawal at the label\
  \ rate. Calculate the medicated volume for the birds served, remove access to unmedicated\
  \ bypass water during administration, and verify that medicated water reaches the\
  \ full line. Resume ordinary water only after the intended volume is consumed.\\\
  n\\nThe FMS entry should retain the individual trap series, exposure intervals,\
  \ treatment calculation, product, each administration date, and second-dose due\
  \ date. Keep post-treatment traps in the same positions. Request an earlier return\
  \ if counts rise rapidly, affected locations multiply, or birds develop increasing\
  \ irritation, feather disturbance, pallor, or reduced condition.\\n\\nKaren Holzmann,\
  \ DVM\\n\", \"attachments\": [], \"unread\": false, \"in_reply_to\": null}\n[msg_330]\
