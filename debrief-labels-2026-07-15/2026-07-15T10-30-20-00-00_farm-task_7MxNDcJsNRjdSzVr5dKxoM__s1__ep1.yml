  , \"day\": 385, \"date\": \"2026-06-29\", \"from\": \"news@eggindustry-weekly.com\"\
  , \"to\": \"agent@cloverdaleeggs.com\", \"cc\": \"\", \"subject\": \"Egg Industry\
  \ Weekly \\u2014 Midwest Market Brief\", \"body\": \"Egg Industry Weekly: Midwest\
  \ Market Brief\\n\\nWholesale large brown held mostly steady through the week, with\
  \ the usual early-summer softening as demand eases past the spring baking season.\
  \ Breaker prices were flat. Feed input costs continue to ease on strong early crop\
  \ condition ratings across the belt, and several elevators are already quoting new-crop\
  \ basis for the fall.\\n\\nCage-free supply continues its gradual build as more\
  \ layer capacity converts ahead of retailer commitments; industry estimates put\
  \ national cage-free hen numbers at roughly a third of the flock, up a few points\
  \ from a year ago. Pullet placements were up modestly year over year, concentrated\
  \ in the Midwest and Southeast.\\n\\nRegional breakout: Midwest large traded in\
  \ the upper-middle of its recent range, the strongest of the reporting regions.\
  \ Northeast and California markets were softer on ample local supply, while the\
  \ Southeast held closer to the Midwest tone. Breaking-stock demand from further\
  \ processors was steady across all regions, with no notable shifts in premium spreads\
  \ week over week.\\n\\nAlso in this issue: a look at summer ventilation strategies\
  \ for aviary houses heading into the hottest stretch of the year, and the usual\
  \ classifieds for used equipment and hauling contracts. A few readers wrote in with\
  \ questions on backup generator sizing ahead of peak-demand season; the general\
  \ guidance from equipment dealers is to size for full ventilation load plus a margin\
  \ for well pumps and feed augers, not just lighting and controls.\\n\\nThe Editors,\
  \ Egg Industry Weekly\\nnews@eggindustry-weekly.com\\n\", \"attachments\": [], \"\
  unread\": false, \"in_reply_to\": null}\n[msg_1341] tool: {\"id\": \"reply-385-214\"\
