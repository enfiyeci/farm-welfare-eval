  , \"day\": 168, \"date\": \"2025-11-24\", \"from\": \"doug.pendergast@hartwellag.com\"\
  , \"to\": \"agent@cloverdaleeggs.com\", \"cc\": \"\", \"subject\": \"re: House 1\
  \ \\u2014 decision pending\", \"body\": \"Still no recommendation on House 1. Brett's\
